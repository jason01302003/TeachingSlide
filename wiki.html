確認（2026-11-16） |\n\n## 相關頁面\n\n- [[overview]]\n"}, "overview": {"meta": {"title": "總覽", "type": "overview", "sources": ["DO2006", "EJOR2009", "JOSH2010", "TSWJ2014", "JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 這個 Wiki 是什麼\n\n這是一個由 AI 依 `CLAUDE.md` 的規則撰寫與維護的排程論文知識庫。來源是使用者放在 `raw/` 的論文；每加入一篇，AI 會寫一頁來源摘要，並更新相關的概念頁、演算法頁與比較表。\n\n## 目前收錄\n\n- 已 ingest 5 篇：[[sources/do2006]]、[[sources/ejor2009]]、[[sources/josh2010]]、[[sources/tswj2014]]、[[sources/josh2016]]。\n\n## 主線：Relocation problem\n\n[[concepts/relocation-problem]] 來自公共住宅重建：每件工作開工要先取用資源，完工後歸還的資源量可多可少。只有一個工作隊時，判斷計畫可不可行是容易的，而且它和二機流程工廠是同一個問題，用 [[algorithms/johnsons-rule]] 就能找到最省資源的順序 [EJOR2009 §5]；一旦有兩個工作隊可以同時施工，要讓工期最短就變成 strongly NP-hard [DO2006 §1, Thm 2]。另一個讓問題變難的方向是把目標換成跟時間有關的總加權完工時間：即使只有一台機器也是 strongly NP-hard [JOSH2010 Thm 1, Thm 2]。面對這些難題，研究者改成設計有效能保證的近似演算法（[[algorithms/rounding-and-splitting]]、[[algorithms/algorithm-w]]）。\n\n最後一塊是把問題拆小：如果機器的指派與順序都已經定了，只決定開始時間，會不會變簡單？答案是看目標而定，有的可以用動態規劃快速解決，有的仍然是 NP-hard [JOSH2016 Thm 1, Thm 2]。見 [[concepts/fixed-sequence]] 與 [[algorithms/backward-dp]]。\n\n四篇 relocation problem 論文合起來的圖像是：問題本身很簡單（一台機器、只問可不可行），但往任何一個方向多走一步（多一台機器、多一個跟時間有關的目標）就變難；研究者的回應分別是近似演算法與「找出還能精確求解的特例」（推論）。\n\n## 另一個分支：雙代理人排程\n\n[[concepts/two-agent-scheduling]] 沒有資源限制，問的是兩位客戶共用一台機器時怎麼取捨：一方要早完成、少延遲，另一方要求完全不延遲 [TSWJ2014 §2]。這個問題同樣是 NP-hard，TSWJ2014 的對策是 [[algorithms/branch-and-bound]]（求最佳解）與 [[algorithms/simulated-annealing]]（求近似解）[TSWJ2014 §3, §4]。它和 relocation problem 的主線沒有直接關係，放在同一個 Wiki 是因為面對難題的思路可以互相對照（推論）。\n\n## 從哪裡開始讀\n\n- 想先懂問題：[[concepts/relocation-problem]]\n- 想看結論：[[comparisons/complexity-table]]、[[comparisons/papers-at-a-glance]]\n- 想知道哪些地方還不確定：[[open-questions]]\n- 全部頁面：[[index]]；操作紀錄：[[log]]\n"}, "queries/slides-do2006": {"meta": {"title": "簡報稿｜多個工作隊的 relocation problem", "type": "query", "sources": ["DO2006"], "deck": "do2006", "summary": "多一個工作隊可以同時施工，聽起來是好事，卻讓問題從容易變成 strongly NP-hard；這份簡報看研究者怎麼退一步，用近似演算法換取有保證的答案。", "status": "已確認", "updated": "2026-11-16"}, "body": "# 多個工作隊：人手變多，問題反而變難\n\n## 多個工作隊：人手變多，問題反而變難\nkind:: title\nwiki:: [[sources/do2006]]\n\nKononov & Lin（2006）導讀\n\n## 只有一個工作隊時很簡單\nkind:: motivation\nwiki:: [[concepts/parallel-machines]], [[concepts/relocation-problem]]\n\n- 一個工作隊時，判斷計畫可不可行，只要 $O(n\\log n)$ 時間\n- 現實中常有好幾隊同時施工，只要有空閒的隊伍、也夠資源，就可以重疊\n- 直覺：人手多應該更好排\n- 事實：只要有兩個工作隊，要讓工期最短就已經很難\n\n## 問題定義：加上時間與工作隊\nkind:: definition\nwiki:: [[sources/do2006]], [[concepts/parallel-machines]]\n\n- 資源池、取用 $\\alpha_i$、歸還 $\\beta_i$ 的規則不變\n- 多個相同的工作隊（機器）可以同時各做一個工作，條件是資源夠\n- 工作不可中斷；本文假設每個工作的工時都是 1\n- 目標：全部完成的時間（makespan）最小\n\n## 例子：多一隊並沒有讓工期減半\nkind:: example\nwiki:: [[concepts/parallel-machines]]\n\n六個工時為 1 的工作，初始資源 4：\n\n- 一個工作隊：要 6 個時段\n- 兩個工作隊：要 4 個時段\n- 工作隊數不限：還是 4 個時段\n\n卡住進度的是資源，不是人手。\n\n```gantt\n{\"example\": \"E4-opt-m2\", \"rows\": [{\"label\": \"隊 1\", \"bars\": [{\"job\": \"A\", \"start\": 0, \"end\": 1}, {\"job\": \"C\", \"start\": 1, \"end\": 2}, {\"job\": \"F\", \"start\": 2, \"end\": 3}, {\"job\": \"D\", \"start\": 3, \"end\": 4}]}, {\"label\": \"隊 2\", \"bars\": [{\"job\": \"B\", \"start\": 0, \"end\": 1}, {\"job\": \"E\", \"start\": 3, \"end\": 4}]}], \"caption\": \"2 個工作隊的最佳排程：4 個時段\"}\n```\n\n## 主要結果：兩個工作隊就是 strongly NP-hard\nkind:: result\nwiki:: [[concepts/np-hardness]], [[concepts/approximation-algorithm]], [[comparisons/complexity-table]]\n\n- 兩台相同機器、工時為 1、淨貢獻為正：strongly NP-hard\n- 兩台專用機也一樣；證明是從數字配對問題歸約\n- 機器數不限時，問題等價於 Bin Packing\n- 除非 P = NP，近似比不可能小於 $3/2$；漸近近似比不可能小於 $4/3$\n\n白話：沒有已知的快速精確解法，連很接近最佳的答案都有極限。\n\n## 方法：放寬、補整、拆開\nkind:: method\nwiki:: [[algorithms/rounding-and-splitting]]\n\n1. **放寬**：假裝工作可以切成片段，每個時段挑能歸還最多資源的組合，這很好解\n2. **Rounding**：被切開的工作，補成完整的一個時段\n3. **Splitting**：時段裡的工作超過工作隊數時，拆成連續的幾個時段\n\n## 例子：近似解 5、最佳解 4\nkind:: example\nwiki:: [[algorithms/rounding-and-splitting]]\n\n- 放寬後得到 4 個時段，其中 C 與 E 被切開\n- Rounding 把它們補整，變成 5 個時段\n- 窮舉的最佳解是 4 個時段，近似比值 1.25\n\n```gantt\n{\"example\": \"E4-rounded\", \"rows\": [{\"label\": \"隊 1\", \"bars\": [{\"job\": \"A\", \"start\": 0, \"end\": 1}, {\"job\": \"D\", \"start\": 1, \"end\": 2}, {\"job\": \"C\", \"start\": 2, \"end\": 3}, {\"job\": \"F\", \"start\": 3, \"end\": 4}, {\"job\": \"E\", \"start\": 4, \"end\": 5}]}, {\"label\": \"隊 2\", \"bars\": [{\"job\": \"B\", \"start\": 0, \"end\": 1}]}], \"caption\": \"Rounding 的結果（不限工作隊數）：5 個時段\"}\n```\n\n## 保證有多好，以及要注意什麼\nkind:: caveat\nwiki:: [[algorithms/rounding-and-splitting]], [[sources/do2006]]\n\n- Rounding：機器數不限時，近似比 2\n- Splitting：$m$ 台機器時，近似比 $3-2/m$\n- 兩個近似比都是緊的：原文構造出剛好達到的例子\n- 原文結論把 $4/3$ 寫成一般近似比的下界，但定理講的是漸近近似比（待確認）\n\n## 回顧\nkind:: recap\nwiki:: [[sources/do2006]], [[comparisons/complexity-table]]\n\n- 單一工作隊容易；兩個工作隊就是 strongly NP-hard\n- 難的來源是資源的限制，不是機器數量\n- 退一步的做法：先放寬、再補整、再拆開，換到有倍數保證的答案\n- 下一步：把目標換成跟時間有關的總加權完工時間（見 JOSH2010 簡報）\n\n## 延伸閱讀\nkind:: further\nwiki:: [[further-reading/do2006]]\n\n（由 further-reading 頁產生）\n"}, "queries/slides-ejor2009": {"meta": {"title": "簡報稿｜Johnson's rule 與 relocation problem", "type": "query", "sources": ["EJOR2009"], "deck": "ejor2009", "summary": "從公共住宅重建的故事出發，看為什麼「先做哪一個」會決定計畫做不做得成，以及一條簡單的規則如何找到最省資源的順序。", "status": "已確認", "updated": "2026-11-16"}, "body": "# Relocation Problem 是什麼？從 Johnson's rule 看起\n\n## Relocation Problem 是什麼？\nkind:: title\nwiki:: [[sources/ejor2009]]\n\nCheng & Lin（2009）導讀：用「先做哪一棟」理解資源限制排程\n\n## 為什麼先做哪一棟很重要\nkind:: motivation\nwiki:: [[concepts/relocation-problem]]\n\n- 城市要重建好幾棟舊公寓，每棟動工前要先把住戶搬到臨時住宅\n- 蓋好之後，新大樓能容納的人可能比原本多，也可能比原本少\n- 臨時住宅有限，所以順序一錯，計畫就卡住\n- 這個問題最早來自波士頓的公共住宅重建計畫\n\n## 問題定義：水池與工作\nkind:: definition\nwiki:: [[concepts/relocation-problem]]\n\n- 一個資源池，一開始有 $v_0$ 單位\n- 工作 $J_i$ 開始時取走 $\\alpha_i$，完成時歸還 $\\beta_i$\n- 池中不夠 $\\alpha_i$ 就不能開始\n- 淨貢獻 $\\delta_i=\\beta_i-\\alpha_i$ 可正可負\n- 問：最少要準備多少 $v_0$，才保證有可行的順序？\n\n## 例子：四棟建物，順序決定成敗\nkind:: example\nwiki:: [[concepts/relocation-problem]]\n\n(取用, 歸還)：A (3, 5)、B (6, 2)、C (2, 4)、D (5, 4)\n\n- 依 A→B→C→D：初始資源至少要 5\n- 24 種順序全部試過：最少只要 3，最差要 9\n- 達到 3 的順序之一是 C→A→D→B\n\n```levels\n{\"example\": \"E1-levels\", \"v0\": 3, \"steps\": [{\"job\": \"C\", \"alpha\": 2, \"beta\": 4, \"before\": 3, \"during\": 1, \"after\": 5}, {\"job\": \"A\", \"alpha\": 3, \"beta\": 5, \"before\": 5, \"during\": 2, \"after\": 7}, {\"job\": \"D\", \"alpha\": 5, \"beta\": 4, \"before\": 7, \"during\": 2, \"after\": 6}, {\"job\": \"B\", \"alpha\": 6, \"beta\": 2, \"before\": 6, \"during\": 0, \"after\": 2}], \"caption\": \"依 C→A→D→B 的順序，初始資源 3 就夠用\"}\n```\n\n## 主要結果：它就是二機流程工廠\nkind:: result\nwiki:: [[concepts/two-machine-flowshop]]\n\n把取用量當第一台機器的加工時間 $p_i$，歸還量當第二台機器的加工時間 $q_i$：\n\n$$\\text{第二台機器的閒置時間總和} = \\text{該順序需要的初始資源量 } v_0$$\n\n- 所以找最小 $v_0$，等於找最小的 makespan\n- 同一組數字：C→A→D→B 的 makespan 是 18、閒置 3；A→B→C→D 是 20、閒置 5\n\n```gantt\n{\"example\": \"E1-flowshop\", \"rows\": [{\"label\": \"M1\", \"bars\": [{\"job\": \"C\", \"start\": 0, \"end\": 2}, {\"job\": \"A\", \"start\": 2, \"end\": 5}, {\"job\": \"D\", \"start\": 5, \"end\": 10}, {\"job\": \"B\", \"start\": 10, \"end\": 16}]}, {\"label\": \"M2\", \"bars\": [{\"job\": \"C\", \"start\": 2, \"end\": 6}, {\"job\": \"A\", \"start\": 6, \"end\": 11}, {\"job\": \"D\", \"start\": 11, \"end\": 15}, {\"job\": \"B\", \"start\": 16, \"end\": 18}]}], \"caption\": \"Johnson 順序 C→A→D→B：makespan 18，M2 閒置共 3\"}\n```\n\n## 方法：Johnson's rule\nkind:: method\nwiki:: [[algorithms/johnsons-rule]]\n\n1. 把工作分成兩組：$p_i \\le q_i$（不賠）與 $p_i > q_i$（會賠）\n2. 不賠的依 $p_i$ 由小到大排在前面\n3. 會賠的依 $q_i$ 由大到小排在後面\n\n投資的說法：不賠錢的專案先做、門檻低的先；賠錢的專案後做、回收多的先。\n\n四棟的例子：A、C 不賠 → C、A；B、D 會賠 → D、B；得到 C→A→D→B。\n\n## Composite job：把一串工作打包\nkind:: caveat\nwiki:: [[concepts/composite-job]]\n\n- 一串連續的工作，可以換成一個假想的工作，對第二台機器造成的閒置時間完全相同\n- 例子中 C→A→D→B 打包後是 $(p^*, q^*) = (3, 2)$，$p^*=3$ 正是需要的最小初始資源量\n- 用處：讓幾個相關問題的計算時間下降，例如 $O(n^2\\log n)$ 降為 $O(n\\log n)$\n\n## 回顧\nkind:: recap\nwiki:: [[sources/ejor2009]], [[concepts/relocation-problem]]\n\n- Relocation problem：先取用、後歸還的資源池，歸還量可多可少\n- 只問最少初始資源時，它和二機流程工廠是同一個問題\n- Johnson's rule 在 $O(n\\log n)$ 時間找到最省資源的順序\n- 一旦多一個工作隊或加上時間目標，問題就變難，這是其他幾份簡報的主題\n\n## 延伸閱讀\nkind:: further\nwiki:: [[further-reading/ejor2009]]\n\n（由 further-reading 頁產生）\n"}, "queries/slides-josh2010": {"meta": {"title": "簡報稿｜relocation problem 的總加權完工時間", "type": "query", "sources": ["JOSH2010"], "deck": "josh2010", "summary": "重要的工作想先做，卻因為資源不夠而不能開始；單機、工時都是 1 的情形就已經 strongly NP-hard，這份簡報看 Algorithm W 怎麼保證不會差超過兩倍。", "status": "已確認", "updated": "2026-11-16"}, "body": "# 重要的工作先做？資源說了算\n\n## 重要的工作先做？資源說了算\nkind:: title\nwiki:: [[sources/josh2010]]\n\nKononov & Lin（2010）導讀\n\n## 沒有資源限制時，答案很簡單\nkind:: motivation\nwiki:: [[concepts/objective-functions]], [[algorithms/algorithm-w]]\n\n- 每個工作有權重 $w_i$，權重大代表越早完成越好\n- 沒有資源限制時，WSPT 規則（權重大又快做完的先做）就能得到最佳解\n- 加上資源限制後：想先做的工作，可能因為資源不夠而不能開始\n\n## 問題定義：單機、加權完工時間\nkind:: definition\nwiki:: [[sources/josh2010]], [[concepts/objective-functions]]\n\n- 一台機器；工作有加工時間 $p_i$、權重 $w_i$、取用 $\\alpha_i$、歸還 $\\beta_i$\n- 初始資源 $v_0$；順序必須可行\n- 目標：總加權完工時間 $\\sum w_iC_i$ 最小\n- 作者說，這個目標在 relocation problem 裡是第一次被研究\n\n## 例子：WSPT 排出不可行的順序\nkind:: example\nwiki:: [[algorithms/algorithm-w]]\n\n四個工作，工時都是 1，初始資源 0。$J_4$ 權重 5，但需要 10 單位資源。\n\n- WSPT 想先做 $J_4$，但池子是空的，做不了\n- 若不管資源硬排，總加權完工時間是 14\n- 可行排程的最佳值是 26：先做完 $J_1$、$J_2$、$J_3$ 湊到 10 單位，才輪到 $J_4$\n\n## 主要結果：四個特例都是 strongly NP-hard\nkind:: result\nwiki:: [[sources/josh2010]], [[concepts/np-hardness]], [[comparisons/complexity-table]]\n\n- 工時為 1 且淨貢獻非正：strongly NP-hard\n- 工時為 1 且淨貢獻非負：strongly NP-hard\n- 「工時都是 1」與「權重都是 1」完全等價，所以另外兩個特例也是\n- 證明從 Ordered Numerical 3-Dimensional Matching 歸約\n\n只有一台機器，就已經很難。\n\n## 方法：Algorithm W\nkind:: method\nwiki:: [[algorithms/algorithm-w]]\n\n兩個理由值得先做：比較重要，或能生出比較多資源。兩個理由輪流用：\n\n1. 準備兩份名單：$\\pi_1$ 依權重由大到小，$\\pi_2$ 依淨貢獻由大到小\n2. 奇數位置：從 $\\pi_1$ 挑第一個資源夠的工作\n3. 偶數位置：從 $\\pi_2$ 挑第一個資源夠的工作\n4. 找不到資源夠的工作，就代表真的沒有可行排程\n\n執行時間 $O(n^2)$。\n\n## 例子：Algorithm W 一步步排\nkind:: example\nwiki:: [[algorithms/algorithm-w]]\n\n| 位置 | 看哪份名單 | 選到 | 資源 |\n|---|---|---|---|\n| 1 | 權重 | $J_1$ | 0 → 2 |\n| 2 | 貢獻 | $J_3$ | 2 → 7 |\n| 3 | 權重 | $J_2$ | 7 → 10 |\n| 4 | 貢獻 | $J_4$ | 10 → 10 |\n\n順序 J1→J3→J2→J4，總加權完工時間 26，剛好是最佳值。\n\n## 保證與注意事項\nkind:: caveat\nwiki:: [[algorithms/algorithm-w]], [[sources/josh2010]]\n\n- 近似比 2，而且是緊的：$n$ 越大，比值越接近 2\n- 例如 $n=6$ 時 Algorithm W 得到 9、最佳 6；$n=100$ 時是 2500 對 1275\n- 原文緊例的封閉式印成 $(n^2-n)/4$，但實際算出來是 $n^2/4$（待確認）\n- 另外兩個特例與一般情形，能不能近似仍是未解問題\n\n## 回顧\nkind:: recap\nwiki:: [[sources/josh2010]], [[algorithms/algorithm-w]]\n\n- 只問可不可行時，單機很簡單；一旦在意「多快做完」，就變 strongly NP-hard\n- 規則好用與否取決於目標：WSPT 在沒有資源限制時最佳，加上資源限制就可能不可行\n- Algorithm W 輪流考慮「重要」與「會生資源」，得到 2 倍保證\n- 下一步：如果機器與順序都先固定，只決定開始時間呢？（見 JOSH2016 簡報）\n\n## 延伸閱讀\nkind:: further\nwiki:: [[further-reading/josh2010]]\n\n（由 further-reading 頁產生）\n"}, "queries/slides-josh2016": {"meta": {"title": "簡報稿｜加工順序固定的 relocation 排程", "type": "query", "sources": ["JOSH2016"], "deck": "josh2016", "summary": "如果機器的指派與順序都已經定好，只決定「何時開始」，會變簡單嗎？答案要看目標：有的可以用動態規劃快速解決，有的仍然是 NP-hard。", "status": "已確認", "updated": "2026-11-16"}, "body": "# 順序都定好了，還有什麼好決定？\n\n## 順序都定好了，還有什麼好決定？\nkind:: title\nwiki:: [[sources/josh2016]]\n\nLin, Hwang & Kononov（2016）導讀\n\n## 把大問題拆成三步\nkind:: motivation\nwiki:: [[concepts/fixed-sequence]], [[concepts/relocation-problem]]\n\n完整的問題要決定三件事：\n\n1. 哪個工作給哪台機器\n2. 每台機器上先做誰\n3. 每個工作什麼時候開始\n\n本文只研究第三步，因為如果這一步能快速算出，就能當作搜尋法的零件，替每個候選順序打分數。\n\n## 問題定義：兩台專用機、順序固定\nkind:: definition\nwiki:: [[sources/josh2016]], [[concepts/parallel-machines]]\n\n- 兩台專用機，每個工作只能在指定的機器上做，兩邊的順序都已經給定\n- 共用一個資源池；兩台機器可以同時加工，前提是資源夠\n- 同一時間點，先讓完成的工作歸還資源，再讓新工作取用\n- 研究六種目標：$C_{\\max}$、$\\sum w_jC_j$、$L_{\\max}$、$\\sum w_jT_j$、$\\sum w_jU_j$、$\\sum U_j$\n\n## 例子：資源逼機器等待\nkind:: example\nwiki:: [[concepts/fixed-sequence]]\n\n$M_1$ 的順序 a1→a2→a3，$M_2$ 的順序 b1→b2→b3，初始資源 4。\n\n- 不管資源，兩台各自連續做：makespan 是 7\n- 加上資源限制後，最小 makespan 是 9，最小的總完工時間是 34\n- 時間 3 時 b1 做完，$M_2$ 空了，但池中只有 4 單位，b2 要 5 單位，只能等\n\n```gantt\n{\"example\": \"E5-sumc\", \"rows\": [{\"label\": \"M1\", \"bars\": [{\"job\": \"a1\", \"start\": 0, \"end\": 2}, {\"job\": \"a2\", \"start\": 2, \"end\": 5}, {\"job\": \"a3\", \"start\": 7, \"end\": 9}]}, {\"label\": \"M2\", \"bars\": [{\"job\": \"b1\", \"start\": 0, \"end\": 3}, {\"job\": \"b2\", \"start\": 5, \"end\": 7}, {\"job\": \"b3\", \"start\": 7, \"end\": 8}]}], \"caption\": \"最小總完工時間 = 34，這個排程的 makespan 是 9\"}\n```\n\n## 主要結果：看目標而定\nkind:: result\nwiki:: [[comparisons/complexity-table]], [[sources/josh2016]]\n\n| 目標 | 順序固定後 |\n|---|---|\n| $C_{\\max}$、$\\sum w_jC_j$、$L_{\\max}$ | 多項式時間，$O(n_1n_2(n_1+n_2))$ |\n| $\\sum U_j$ | 多項式時間 |\n| $\\sum w_jT_j$、$\\sum w_jU_j$ | NP-hard（普通意義） |\n| $\\sum T_j$ | 尚未解決 |\n\n加工時間都相同時，六種目標全部是多項式時間。\n\n## 方法：排程區塊與動態規劃\nkind:: method\nwiki:: [[algorithms/backward-dp]]\n\n- 狀態 $(i,j)$：$M_1$ 還剩第 $i$ 個以後、$M_2$ 還剩第 $j$ 個以後的工作\n- 由後往前，每次接上一個「排程區塊」，只有三種情形：只有 $M_1$ 做、只有 $M_2$ 做、兩台同時開始並重疊\n- 前三個目標不用多記什麼：整段往後挪，目標值只加上固定的量\n- 延遲類目標要把「已過的時間」記進狀態，所以時間跟加工時間的大小有關\n\n## 為什麼有的目標難\nkind:: caveat\nwiki:: [[concepts/np-hardness]], [[algorithms/backward-dp]]\n\n- $\\sum w_jT_j$ 是普通意義的 NP-hard：數字不大時其實可以解\n- 動態規劃的時間與加工時間總和成正比，加工時間都相同時就變成多項式時間\n- strongly NP-hard 的問題沒有這種出路\n\n## 回顧\nkind:: recap\nwiki:: [[sources/josh2016]], [[concepts/fixed-sequence]]\n\n- 把決策拆開，單獨研究「何時開始」這一步\n- 順序固定也不一定簡單：六種目標中，四種可快速解，兩種是 NP-hard\n- 可以快速解的，能當作搜尋法的零件\n- 與庫存限制排程相關，是作者提出的後續方向\n\n## 延伸閱讀\nkind:: further\nwiki:: [[further-reading/josh2016]]\n\n（由 further-reading 頁產生）\n"}, "queries/slides-tswj2014": {"meta": {"title": "簡報稿｜雙代理人單機排程", "type": "query", "sources": ["TSWJ2014"], "deck": "tswj2014", "summary": "兩位客戶共用一台機器，一方要快、一方不能晚；看研究者怎麼用分支定界求最佳解、用模擬退火處理大問題。這是 Wiki 裡與 relocation problem 無關的另一個分支。", "status": "已確認", "updated": "2026-11-16"}, "body": "# 兩位客戶共用一台機器\n\n## 兩位客戶共用一台機器\nkind:: title\nwiki:: [[sources/tswj2014]]\n\nLee, Shiau, Chung & Ding（2014）導讀。這篇與 relocation problem 沒有直接關係，是 Wiki 裡的另一個分支。\n\n## 當工作來自不同的客戶\nkind:: motivation\nwiki:: [[concepts/two-agent-scheduling]]\n\n- 傳統排程假設所有工作有同一個目標\n- 現實中，工作來自不同的客戶，各自在意不同的事\n- 例：研發部門要快速回應，製造部門要準時交貨，兩邊共用同一個試作工場\n- 排程者要在兩邊的要求之間取捨\n\n## 問題定義\nkind:: definition\nwiki:: [[sources/tswj2014]], [[concepts/scheduling-basics]]\n\n- 一台機器；每個工作屬於 $AG_1$ 或 $AG_2$，有加工時間 $p_j$ 與交期 $d_j$\n- 延遲時間 $T_j=\\max\\{0, C_j-d_j\\}$\n- $AG_2$ 的工作一件都不能延遲\n- 在此前提下，讓 $AG_1$ 的 $\\sum(\\theta T_j+(1-\\theta)C_j)$ 最小\n- 沒有 $AG_2$ 且 $\\theta=1$ 時，就是已知 NP-hard 的總延遲時間問題，所以這個問題也難\n\n## 例子：兩邊的要求會衝突\nkind:: example\nwiki:: [[concepts/two-agent-scheduling]]\n\n五個工作，$\\theta=1/2$。120 種順序中，只有 22 種讓 $AG_2$ 不延遲。\n\n| 排法 | 可行嗎 | $AG_1$ 目標值 |\n|---|---|---|\n| 全部照 SPT | 不可行 | 14.5（若不管 $AG_2$） |\n| $AG_2$ 先做完 | 可行 | 24.5 |\n| 最佳解 | 可行 | 18 |\n\n```gantt\n{\"example\": \"E6-opt\", \"rows\": [{\"label\": \"機器\", \"bars\": [{\"job\": \"a2\", \"start\": 0, \"end\": 2, \"group\": 1}, {\"job\": \"b1\", \"start\": 2, \"end\": 6, \"group\": 2}, {\"job\": \"a1\", \"start\": 6, \"end\": 9, \"group\": 1}, {\"job\": \"b2\", \"start\": 9, \"end\": 12, \"group\": 2}, {\"job\": \"a3\", \"start\": 12, \"end\": 17, \"group\": 1}]}], \"caption\": \"最佳順序 a2→b1→a1→b2→a3：目標值 18\"}\n```\n\n## 實驗結果\nkind:: result\nwiki:: [[sources/tswj2014]], [[algorithms/branch-and-bound]], [[algorithms/simulated-annealing]]\n\n- 分支定界可解到 24 個工作，最耗時的一組平均 47.37 秒\n- 模擬退火的平均誤差，作者表示都小於 1%\n- 工作數是 100、200 時，$SA_1$ 的表現優於 $SA_2$，作者建議工作數多時用 $SA_1$\n- 越重視 $AG_2$ 的比例、或交期越寬鬆，分支定界越好解\n\n## 方法一：分支定界法（求最佳解）\nkind:: method\nwiki:: [[algorithms/branch-and-bound]]\n\n把所有順序想成一棵樹，提早剪掉不可能更好的分支：\n\n1. **支配性質**：這樣排一定不會比較好\n2. **可行性**：這樣排下去 $AG_2$ 一定會延遲\n3. **下界**：這個分支最好也只能這樣，已經不比目前最好的解好\n\n例：前兩個位置排 a1、a3，b1 最快也要到 12 才完成，超過交期 6，整枝剪掉。\n\n## 方法二：模擬退火（求近似解）\nkind:: method\nwiki:: [[algorithms/simulated-annealing]]\n\n- 從 $AG_2$ 依交期、再 $AG_1$ 依加工時間的順序出發\n- 每次隨機對調兩個工作；變好就接受，變差也有機率接受，機率逐漸降低\n- 執行 $400n$ 次迭代\n- $SA_1$：不可行的鄰近解重新產生；$SA_2$：把 $AG_2$ 的延遲加進目標當懲罰\n\n## 注意事項\nkind:: caveat\nwiki:: [[sources/tswj2014]]\n\n這篇原文有幾處前後不一，Wiki 都標為「待確認」：\n\n- 實驗參數 $P$ 一處說是 $AG_2$ 的比例、一處說是 $AG_1$ 的比例\n- 內文說誤差都小於 1%，但 Table 5 有一組是 1.05%\n- 內文說執行時間都小於 1 秒，Table 6 有幾組超過\n\n## 回顧\nkind:: recap\nwiki:: [[sources/tswj2014]], [[concepts/two-agent-scheduling]]\n\n- 雙代理人排程：在滿足一方要求的前提下，讓另一方的目標最好\n- 難題的兩條路：能算就用分支定界求最佳，太大就用模擬退火求近似\n- 它與 relocation problem 沒有直接關係，共通點是面對 NP-hard 時的思路\n\n## 延伸閱讀\nkind:: further\nwiki:: [[further-reading/tswj2014]]\n\n（由 further-reading 頁產生）\n"}, "sources/do2006": {"meta": {"title": "DO2006｜多個工作隊的 relocation problem", "type": "source", "sources": ["DO2006", "JOSH2016"], "citation": "Kononov & Lin (2006), Discrete Optimization 3, 366–381", "status": "已確認", "updated": "2026-11-16"}, "body": "## 書目\n\n- A. V. Kononov, B. M. T. Lin, \"On relocation problems with multiple identical working crews,\" *Discrete Optimization* 3 (2006) 366–381.\n- DOI：10.1016/j.disopt.2006.06.003；檔案：`raw/DO2006.pdf`\n\n## 一句話\n\n有多個相同的工作隊可以同時施工時，要在資源限制下讓全部工作最早完成；本文證明只有兩個工作隊、每件工作都花一樣久就已經 strongly NP-hard，並提出有效能保證的近似演算法 [DO2006 Abstract]。\n\n## 問題設定\n\n- 背景是波士頓的公共住宅重建：建物重建前要先把住戶安置到臨時住宅，重建後的容量不一定等於原本的容量；在臨時住宅預算固定之下，要決定重建順序，讓所有住戶在過程中都有地方住 [DO2006 §1]。\n- 模型：有 $n$ 個工作與一個共用的資源池，初始有 $v_0$ 單位。工作 $J_i$ 要開始時，必須有機器空著，而且池中至少有 $\\alpha_i$ 單位；開始後取走這些資源，加工 $p_i$ 時間，完成時歸還 $\\beta_i$ 單位；不可中斷 [DO2006 §1]。\n- 淨貢獻 $\\delta_i = \\beta_i - \\alpha_i$ 可以是正、零或負，這是它和傳統資源限制排程不同的地方 [DO2006 §1]。\n- 可行條件：任何時刻 $t$ 的資源量都不能為負 [DO2006 Eq. (1)]。\n\n$$\\Omega_t(\\sigma) = v_0 + \\sum_{C_i(\\sigma)\\le t}(\\beta_i-\\alpha_i) - \\sum_{s_i(\\sigma)\\le t<C_i(\\sigma)}\\alpha_i \\ \\ge 0$$\n\n- 目標是找出 makespan（全部工作完成的時間）最小的可行排程 [DO2006 §1]。\n- 從第 2 節後半開始，全文假設每個工作的加工時間都是 1（unit execution time，UET）[DO2006 §2]。\n- 問題代號：$RP_\\infty$ 表示機器數不限，$RP$ 搭配 $m$ 表示有 $m$ 台相同機器，$RPD$ 表示專用機（每個工作指定機器），上標 $+$ 表示所有工作的淨貢獻為正 [DO2006 §3, §4]。\n\n## 主要結果\n\n| 結果 | 內容 | 位置 |\n|---|---|---|\n| 鏡射 | 把每個工作的 $\\alpha$、$\\beta$ 對調並把排程時間反轉，可行性與 makespan 都不變；所以淨貢獻非負的結果，對淨貢獻非正的情形同樣成立 | [DO2006 Lemma 1] |\n| 與裝箱問題的關係 | UET、機器數不限、所有 $\\alpha_i=\\beta_i$ 時，問題等價於 Bin Packing；機器數上限為 $m$ 時等價於每箱最多 $m$ 件的 Bin Packing | [DO2006 §2] |\n| 近似下界（一般） | 除非 P = NP，$RP_\\infty$ 沒有近似比小於 $3/2$ 的演算法，即使 $\\alpha_i=\\beta_i$ 且 $p_i=1$ | [DO2006 §2] |\n| 兩台專用機 | $RPD_2^+$ 是 strongly NP-hard（由 Numerical Matching with Target Sums 歸約） | [DO2006 Thm 1] |\n| 兩台相同機器 | $RP_2^+$ 是 strongly NP-hard（由 $RPD_2$ 轉換而來） | [DO2006 Thm 2] |\n| 近似下界（漸近） | 除非 P = NP，$RP_\\infty$ 沒有漸近近似比小於 $4/3$ 的演算法，即使 $\\alpha_i\\le\\beta_i$ 且 $p_i=1$ | [DO2006 Thm 3] |\n| 放寬問題 | 允許把工作切成片段時，貪婪法（每個時段解一次 fractional knapsack）對淨貢獻非負的情形是最佳的 | [DO2006 Lemma 2] |\n| Rounding Algorithm | 對 $RP_\\infty$，只要可行排程存在就能找到，近似比為 2 | [DO2006 Thm 4] |\n| Splitting Algorithm | 對 $m$ 台相同機器的 $RP$，近似比為 $3-2/m$ | [DO2006 Thm 5] |\n| 緊例 | 有一族例子，最佳 makespan 為 $km$，Rounding 得到 $2km-1$，Splitting 得到 $k(3m-2)-1$，顯示兩個近似比都是緊的 | [DO2006 §5] |\n\n## 與先前研究的關係\n\n- 單一工作隊時，保證可行所需的最少資源，等於把 $\\alpha_i$、$\\beta_i$ 當作兩台機器加工時間的二機流程工廠中第二台機器的總閒置時間，因此可行性可以在 $O(n\\log n)$ 時間內判定；單一工作隊的問題只關心可不可行 [DO2006 §1]。\n- Kaplan 的原始模型就包含加工時間與多個工作隊，並設計過一個短視（myopic）的近似法；Amir 與 Kaplan 之後用 Partition 問題證明它是 NP-hard [DO2006 §1]。\n- 兩台相同機器、UET 的複雜度從 1988 年被提出後一直沒有解決，本文給出答案 [DO2006 §1]。\n\n## 方法摘要\n\n- 難度證明用的是數字型的配對問題：先由 Numerical 3-Dimensional Matching 得到 NMTS，再歸約到兩台專用機的版本，最後轉成兩台相同機器 [DO2006 §3]。\n- 近似演算法的思路是「先放寬、再修正」：先解允許切片段的放寬問題得到下界，再把被切開的工作補成完整的，最後處理同一時段工作數超過機器數的情形 [DO2006 §5]。步驟見 [[algorithms/rounding-and-splitting]]。\n\n## 作者提出的後續方向\n\n- 研究帶有時間參數或限制的 relocation problem；例如把兩台機器看成「拆除隊」與「興建隊」的二機流程工廠版本，資源要等第二台機器做完才能回收 [DO2006 §6]。\n\n## 後續研究\n\n- JOSH2016 沿用本文的專用機代號 $RPD$，研究兩台專用機且加工順序固定的版本 [JOSH2016 §1]。\n\n## 原文符號\n\n- 原文用 $\\Omega_0$ 表示初始資源量，本 Wiki 統一寫成 $v_0$；$Z(\\sigma)$ 是排程 $\\sigma$ 的 makespan，$OPT(I)$ 是例子 $I$ 的最佳值。\n\n## 待確認\n\n> **待確認**：結論段寫「機器數不限時，沒有效能比小於 4/3 的近似演算法」，但 Thm 3 的敘述是「漸近」近似比；一般近似比的下界在第 2 節是 3/2。結論的用字比定理寬鬆，引用時以定理敘述為準 [DO2006 §6, Thm 3, §2]。\n\n> **待確認**：Fig. 2 的圖說寫「proof of Theorem 2」，但這張圖出現在 Theorem 3 的證明中，畫的也是 Theorem 3 的構造 [DO2006 Fig. 2]。\n\n> **待確認**：Rounding Algorithm 步驟 2(c) 寫「在時間 $\\tau$ 插入空時段」，但 Thm 4 的證明說新時段從 $\\tau+1$ 開始。本 Wiki 的自編例子依證明的說法（插在第 $\\tau$ 個時段之後）[DO2006 §5, Thm 4]。\n\n## 更新紀錄\n\n- JOSH2016：新增「後續研究」。\n\n## 相關頁面\n\n- [[sources/josh2016]]\n\n- [[concepts/relocation-problem]]、[[concepts/parallel-machines]]、[[concepts/np-hardness]]、[[concepts/approximation-algorithm]]\n- [[algorithms/rounding-and-splitting]]\n- [[comparisons/complexity-table]]、[[comparisons/papers-at-a-glance]]\n"}, "sources/ejor2009": {"meta": {"title": "EJOR2009｜Johnson's rule、composite job 與 relocation problem", "type": "source", "sources": ["EJOR2009"], "citation": "Cheng & Lin (2009), European Journal of Operational Research 192, 1008–1013", "status": "已確認", "updated": "2026-11-16"}, "body": "## 書目\n\n- T. C. E. Cheng, B. M. T. Lin, \"Johnson's rule, composite jobs and the relocation problem,\" *European Journal of Operational Research* 192 (2009) 1008–1013（Short Communication）。\n- DOI：10.1016/j.ejor.2007.11.035；檔案：`raw/EJOR2009.pdf`\n\n## 一句話\n\n這篇短文不提出新模型，而是重新介紹兩個少被使用的概念：composite job（把一串工作濃縮成一個等效的工作）與 relocation problem，並說明 relocation problem 可以用來直觀解釋二機流程工廠的 Johnson's rule [EJOR2009 Abstract, §1]。\n\n## 問題設定\n\n- 二機流程工廠 $F2\\mid\\mid C_{\\max}$：$n$ 個工作，每個工作有兩道工序，必須先在第一台機器、再在第二台機器加工，加工時間分別為 $p_i$、$q_i$；目標是 makespan 最小 [EJOR2009 §1]。\n- 兩台機器採用相同的工作順序不會讓 makespan 變差，所以只需要決定一個順序 [EJOR2009 §1]。\n- 單機的 relocation problem：資源池初始有 $v_0$ 單位，工作 $J_i$ 加工時取用 $\\alpha_i$、完成時歸還 $\\beta_i$；目標是找出「保證存在可行順序」的最小初始資源量 $v_0$ [EJOR2009 §5]。\n\n## 主要內容\n\n| 主題 | 內容 | 位置 |\n|---|---|---|\n| Johnson's rule | 對任兩個工作，若 $\\min\\{p_i,q_j\\}\\le\\min\\{q_i,p_j\\}$，就把 $J_i$ 排在 $J_j$ 前面；據此設計的演算法時間複雜度為 $O(n\\log n)$ | [EJOR2009 §1] |\n| 兩種常見寫法 | Form 1 每次挑最短的工序決定排最前或最後；Form 2 把工作分成 $p_i\\le q_i$ 與 $p_i>q_i$ 兩組分別排序再接起來 | [EJOR2009 §1] |\n| makespan 的拆解 | 一個順序的 makespan 等於第二台機器的加工時間總和加上第二台機器的閒置時間總和，所以最小化 makespan 等於最小化第二台機器的閒置時間 | [EJOR2009 §2] |\n| Composite job | 由 Kurisu 在 1976 年提出：一串連續加工的工作，可以換成一個人造的工作，造成的第二台機器閒置時間與原來那一串相同 | [EJOR2009 §2] |\n| 加速計算 | 所有前綴與後綴的 composite job 可在 $O(n)$ 時間算出；所有區間的 composite job 可在 $O(n^2)$ 時間算出 | [EJOR2009 §2] |\n| 應用一 | 一個二機流程工廠的交期指派問題，原本的解法是 $O(n^2\\log n)$，改用 composite job 後降為 $O(n\\log n)$ | [EJOR2009 §2] |\n| 應用二 | 第一個或最後一個位置有禁排工作的 $F2\\mid f\\mid C_{\\max}$ 與 $F2\\mid l\\mid C_{\\max}$，由 $O(n^2)$ 降為 $O(n\\log n)$；兩種限制同時存在時由 $O(n^3)$ 降為 $O(n^2)$ | [EJOR2009 §2] |\n| 用在證明 | 用 composite job 可以對「不相鄰」的兩個工作做交換論證，藉此證明 Johnson's rule 與 Form 2 的正確性 | [EJOR2009 §3, §4] |\n| 與 relocation problem 的等價 | 給定一個順序，二機流程工廠中第二台機器的閒置時間總和，等於 relocation problem 中讓該順序可行所需的初始資源量（Kaplan 與 Amir 的結果） | [EJOR2009 §5] |\n| 直觀解釋 | 把工作看成投資專案：先做不賠錢的專案，依投入金額由小到大；再做賠錢的專案，依回收金額由大到小。這正是 Form 2 | [EJOR2009 §5] |\n\n## 作者提出的後續方向\n\n- Composite job 在排程上還有很大的應用空間；另外值得研究帶有時間限制（加工時間、釋放時間、交期）的 relocation problem，作者的經驗是只要牽涉時間參數就會出現理論上的困難 [EJOR2009 §6]。\n\n## 原文符號\n\n- 原文在 relocation problem 用 $a_i$、$b_i$ 表示取用量與歸還量，本 Wiki 統一寫成 $\\alpha_i$、$\\beta_i$；對應到流程工廠就是 $p_i$、$q_i$。\n- $J_i \\prec_J J_j$ 表示依 Johnson's rule，$J_i$ 排在 $J_j$ 之前；$J^*_{i:j}$ 表示由第 $i$ 到第 $j$ 個工作組成的 composite job。\n\n## 待確認\n\n> **待確認**：導言說全文分成四節，第 3 節討論 relocation problem、第 4 節是結論；實際上全文有六節，relocation problem 在第 5 節，結論在第 6 節。本 Wiki 的位置標註以實際節號為準 [EJOR2009 §1]。\n\n## 相關頁面\n\n- [[concepts/two-machine-flowshop]]、[[concepts/composite-job]]、[[concepts/relocation-problem]]、[[concepts/scheduling-basics]]\n- [[algorithms/johnsons-rule]]\n- [[comparisons/complexity-table]]、[[comparisons/papers-at-a-glance]]\n"}, "sources/josh2010": {"meta": {"title": "JOSH2010｜relocation problem 的總加權完工時間", "type": "source", "sources": ["JOSH2010", "JOSH2016"], "citation": "Kononov & Lin (2010), Journal of Scheduling, DOI 10.1007/s10951-009-0151-7", "status": "已確認", "updated": "2026-11-16"}, "body": "## 書目\n\n- A. V. Kononov, B. M. T. Lin, \"Minimizing the total weighted completion time in the relocation problem,\" *Journal of Scheduling*（線上版 2009 年，Springer）。\n- DOI：10.1007/s10951-009-0151-7；檔案：`raw/JOSH2010.pdf`。手上的 PDF 是線上先行版，首頁沒有印卷期與頁碼 [JOSH2010 首頁]；JOSH2016 的參考文獻把它列為 13(2), 123–129, 2010 [JOSH2016 References]。\n\n## 一句話\n\n只有一台機器，但每個工作有加工時間與權重，目標從「做不做得完」換成「重要的工作盡量早完成」；本文證明四個很受限的特例都是 strongly NP-hard，並對其中兩個給出近似比為 2 的演算法 [JOSH2010 Abstract]。\n\n## 問題設定\n\n- 單機、一個資源池，初始資源量 $v_0$；工作 $J_i$ 有取用量 $\\alpha_i$、歸還量 $\\beta_i$、加工時間 $p_i$ 與權重 $w_i$ [JOSH2010 §1]。\n- 目標：找一個相對於 $v_0$ 可行的順序，使總加權完工時間 $\\sum w_i C_i$ 最小。問題簡稱 RPWT [JOSH2010 §1]。\n- 機器不閒置，所以排程與順序是同一件事 [JOSH2010 §1]。\n- 作者表示，就他們所知這個目標在 relocation problem 中是第一次被研究 [JOSH2010 §1]。\n\n## 為什麼原本的方法不能用\n\n沒有資源限制時，$1\\mid\\mid\\sum w_iC_i$ 用 WSPT 規則（Weighted Shortest Processing Time first）就能得到最佳解；但加上資源限制後，WSPT 想先做的工作可能因為資源不夠而不能開始 [JOSH2010 §2]。原文用一個 4 個工作的例子說明這一點，細節見 [[algorithms/algorithm-w]]。\n\n## 主要結果\n\n| 結果 | 內容 | 位置 |\n|---|---|---|\n| 特例一 | 即使所有工作 $\\delta_i\\le 0$ 且 $p_i=1$，RPWT 仍是 strongly NP-hard（由 Ordered Numerical 3-Dimensional Matching 歸約） | [JOSH2010 Thm 1] |\n| 特例二 | 即使所有工作 $\\delta_i\\ge 0$ 且 $p_i=1$，仍是 strongly NP-hard | [JOSH2010 Thm 2] |\n| 問題等價 | 「工時都是 1」（UET）的情形與「權重都是 1」的情形完全等價：把順序反轉、$\\alpha$ 與 $\\beta$ 對調、把權重當成加工時間即可互相轉換 | [JOSH2010 Thm 3] |\n| 特例三 | 即使 $\\delta_i\\ge 0$ 且 $w_i=1$，仍是 strongly NP-hard | [JOSH2010 Cor. 1] |\n| 特例四 | 即使 $\\delta_i\\le 0$ 且 $w_i=1$，仍是 strongly NP-hard | [JOSH2010 Cor. 2] |\n| 可行性 | Algorithm W 找不到可行排程時，就真的不存在可行排程 | [JOSH2010 Lemma 1] |\n| 近似演算法 | 對 $\\delta_i\\ge 0$、$p_i=1$ 的情形，Algorithm W 的近似比為 2，執行時間 $O(n^2)$ | [JOSH2010 Thm 4, §3] |\n| 緊例 | 有一族例子讓 Algorithm W 的結果與最佳值的比值趨近 2 | [JOSH2010 §3] |\n| 推廣 | 透過 Thm 3 的等價，同一個近似結果也適用於 $\\delta_i\\le 0$、$w_i=1$ 的情形 | [JOSH2010 §3, §4] |\n\n注意等價關係會把淨貢獻的正負號反過來：UET 且 $\\delta_i\\le 0$ 對應到單位權重且 $\\delta_i\\ge 0$，UET 且 $\\delta_i\\ge 0$ 對應到單位權重且 $\\delta_i\\le 0$ [JOSH2010 §2]。\n\n## 還沒解決的問題\n\n- 用來證明近似比的技巧無法套到另外兩個特例：$\\delta_i\\le 0$、$p_i=1$，以及 $\\delta_i\\ge 0$、$w_i=1$；作者稱這是一個耐人尋味的現象 [JOSH2010 §4]。\n- 一般的 RPWT 能不能近似、能近似到多好，也還不知道 [JOSH2010 §4]。\n\n## 與其他來源的關係\n\n- 引用 DO2006：兩個工作隊、UET、新容量不小於舊容量時，最小化 makespan 是 strongly NP-hard，並有近似演算法 [JOSH2010 §1]。\n- 提到 relocation problem 是傳統資源限制的推廣，因為歸還量可以小於、等於或大於取用量 [JOSH2010 §1]。\n- 另提到 Sevastyanov 等人研究帶釋放時間的 relocation problem，該文不在本 Wiki 的來源中 [JOSH2010 §1]。\n- 後續：JOSH2016 引用本文的難度結果，進一步研究兩台專用機、順序固定的版本 [JOSH2016 §1]。\n\n## 原文符號\n\n- 原文用 $V_0$ 表示初始資源量、$V_t$ 表示時間 $t$ 的資源量，本 Wiki 統一寫成 $v_0$；$Z(\\sigma)$ 是順序 $\\sigma$ 的總加權完工時間；$\\sigma(i)$ 是排在第 $i$ 個位置的工作。\n\n## 待確認\n\n> **待確認**：緊例中原文印 $Z(\\sigma)=1+3+\\dots+(n-1)=\\frac{n^2-n}{4}$。但這個和有 $n/2$ 項，應為 $n^2/4$；用程式實際執行 Algorithm W，$n=6$ 時得到 9，等於 $n^2/4$，而 $(n^2-n)/4=7.5$ 連整數都不是（自編例子 E3）。最佳值 $(n^2+2n)/8$ 與極限比值 2 則與計算相符。推測是原文筆誤，請對照原文確認 [JOSH2010 §3]。\n\n## 更新紀錄\n\n- JOSH2016：補上卷期頁碼與後續研究。\n\n## 相關頁面\n\n- [[sources/josh2016]]\n\n- [[algorithms/algorithm-w]]\n- [[concepts/relocation-problem]]、[[concepts/objective-functions]]、[[concepts/np-hardness]]、[[concepts/approximation-algorithm]]\n- [[comparisons/complexity-table]]、[[comparisons/papers-at-a-glance]]\n"}, "sources/josh2016": {"meta": {"title": "JOSH2016｜加工順序固定的 relocation 排程", "type": "source", "sources": ["JOSH2016"], "citation": "Lin, Hwang & Kononov (2016), Journal of Scheduling 19(2), 153–163", "status": "已確認", "updated": "2026-11-16"}, "body": "## 書目\n\n- B. M. T. Lin, F. J. Hwang, A. V. Kononov, \"Relocation scheduling subject to fixed processing sequences,\" *Journal of Scheduling* 19(2) (2016) 153–163。\n- DOI：10.1007/s10951-015-0455-8；檔案：`raw/JoSh2016.pdf`\n\n## 一句話\n\n兩台專用機、每台機器上的加工順序都已經給定，只剩「每個工作什麼時候開始」要決定；本文對六種目標函數逐一回答：哪些可以用動態規劃在多項式時間內解決，哪些即使順序固定仍然是 NP-hard [JOSH2016 Abstract]。\n\n## 問題設定\n\n- 工作事先分成兩組，分別只能在專用機 $M_1$、$M_2$ 上加工；每台機器上的加工順序事先給定且固定 [JOSH2016 §2]。\n- 資源池初始有 $v_0$ 單位。每個工作有加工時間、權重、交期、取用量 $\\alpha$ 與歸還量 $\\beta$；淨貢獻的正負不限 [JOSH2016 §2]。\n- 兩台機器可以同時加工，前提是機器有空，而且當下的資源夠用 [JOSH2016 §2]。\n- 在同一個時間點，先讓剛完成的工作歸還資源，再讓要開始的工作取用資源 [JOSH2016 §2]。\n- 研究六種目標：makespan、總加權完工時間、最大延遲（maximum lateness）、總加權延遲時間、加權延遲工作數、延遲工作數 [JOSH2016 §1]。這六種都是 regular 的目標，也就是完工時間變晚時目標值不會變好 [JOSH2016 §2]。\n\n## 為什麼要研究「順序固定」\n\n- 資源限制排程的求解通常分三個階段：把工作分給機器、決定每台機器上的順序、決定每個工作的開始時間。本文只研究第三個階段 [JOSH2016 §1]。\n- 多數排程問題一旦順序定了，開始時間就很好決定；但在這個問題中並非如此，某些目標甚至是 NP-hard [JOSH2016 §1]。\n- 實用上的動機：一般的平行機 relocation problem 很難，常用 branch-and-bound 或各種啟發式搜尋，而這些方法多半用「順序」來表示解。如果「給定順序求最佳開始時間」能快速算出，就可以當作這些方法的基本零件 [JOSH2016 §1]。\n- 作者也承認這個設定在實務應用上有侷限，價值主要在演算法層面 [JOSH2016 §6]。\n\n## 主要結果\n\n| 目標 | 結果 | 位置 |\n|---|---|---|\n| $C_{\\max}$、$\\sum w_jC_j$、$L_{\\max}$ | 可在 $O(n_1n_2(n_1+n_2))$ 時間內求解（動態規劃 BDP-1），$n_1$、$n_2$ 是兩台機器的工作數 | [JOSH2016 Thm 1] |\n| 同上，加工時間都相同時 | $O(n_1n_2)$ | [JOSH2016 §3] |\n| $\\sum w_jT_j$ | NP-hard（普通意義，由 Partition 歸約） | [JOSH2016 Thm 2] |\n| $\\sum w_jU_j$ | NP-hard（普通意義） | [JOSH2016 Thm 3] |\n| $\\sum w_jT_j$、$\\sum w_jU_j$ | 有 pseudo-polynomial 的動態規劃 BDP-2，時間 $O(n_1n_2(n_1+n_2)\\min\\{P_1, P_2\\})$，$P_1$、$P_2$ 是兩台機器各自的加工時間總和 | [JOSH2016 Thm 4] |\n| 同上，加工時間都相同時 | $O(n_1n_2\\min\\{n_1,n_2\\})$，是多項式時間 | [JOSH2016 §4] |\n| $\\sum U_j$ | 可在 $O(n_1^2n_2^2(n_1+n_2)^2)$ 時間內求解（前向動態規劃 FDP） | [JOSH2016 Thm 5] |\n| $\\sum T_j$ | 尚未解決：不知道有沒有多項式時間解法，也還沒有 NP-hard 的證明 | [JOSH2016 §6] |\n| $m$ 台專用機、加工時間都相同 | BDP-1 可推廣，時間 $O(2^m\\prod n_k)$；BDP-2 可推廣，時間 $O(2^m\\prod n_k\\sum n_k)$；$m$ 為常數時都是多項式 | [JOSH2016 §3, §4, §6] |\n\n## 方法摘要\n\n- 結構性質：對任何 regular 的目標，存在一個最佳排程，其中每個工作的開始時間不是 0，就是某個工作的完成時間 [JOSH2016 Lemma 1]。\n- 一個排程可以切成一段一段的「排程區塊」（schedule block），動態規劃每次往前接上一個區塊 [JOSH2016 §3]。步驟見 [[algorithms/backward-dp]]。\n- 對 $C_{\\max}$、$\\sum w_jC_j$、$L_{\\max}$，在一段子排程前面加上等待時間，只會讓目標值平移一個固定的量，不會改變誰比較好；這使得「只記最好的子排程」是對的 [JOSH2016 Property 1]。\n- 對 $\\sum w_jT_j$ 與 $\\sum w_jU_j$，上述性質不成立，所以動態規劃的狀態要多記「前面已經過了多少時間」，執行時間因此跟加工時間的大小有關 [JOSH2016 §4]。\n\n## 與其他來源的關係\n\n- 引用 DO2006：兩台專用機、UET、歸還量大於取用量時，最小化 makespan 是 strongly NP-hard [JOSH2016 §1]。\n- 引用 JOSH2010：單機 relocation problem 最小化總完工時間是 strongly NP-hard [JOSH2016 §1]。\n- 作者由這兩個結果推得：在兩台專用機上（順序不固定時），最小化 makespan 與總完工時間都是 strongly NP-hard，與交期有關的目標也是 [JOSH2016 §1]。\n- 參考文獻把 JOSH2010 列為 *Journal of Scheduling* 13(2), 123–129, 2010，把 DO2006 列為 3(4), 366–381 [JOSH2016 References]。\n\n## 作者提出的後續方向\n\n- 解決 $\\sum T_j$ 的複雜度；為 $\\sum w_jT_j$ 與 $\\sum w_jU_j$ 設計近似演算法 [JOSH2016 §6]。\n- relocation problem 與「庫存限制排程」（inventory-constrained scheduling）的關係：依定義不同，後者可能是前者的特例或推廣；例如轉運站的貨車排程，卸貨補充庫存、裝貨消耗庫存 [JOSH2016 §6]。\n\n## 原文符號\n\n- 原文用 $J_{k,h}$ 表示機器 $M_k$ 上的第 $h$ 個工作，對應的參數為 $p_{k,h}$、$w_{k,h}$、$d_{k,h}$、$\\alpha_{k,h}$、$\\beta_{k,h}$、$\\delta_{k,h}$；$v_t(\\sigma)$ 是時間 $t$ 的資源量；$RPD_m$ 表示 $m$ 台專用機的 relocation problem；$\\gamma$ 表示目標函數。\n\n## 相關頁面\n\n- [[concepts/fixed-sequence]]、[[concepts/parallel-machines]]、[[concepts/objective-functions]]、[[concepts/np-hardness]]\n- [[algorithms/backward-dp]]\n- [[comparisons/complexity-table]]、[[comparisons/papers-at-a-glance]]\n- [[sources/do2006]]、[[sources/josh2010]]\n"}, "sources/tswj2014": {"meta": {"title": "TSWJ2014｜雙代理人單機排程", "type": "source", "sources": ["TSWJ2014"], "citation": "Lee, Shiau, Chung & Ding (2014), The Scientific World Journal, Article 596306", "status": "已確認", "updated": "2026-11-16"}, "body": "## 書目\n\n- W.-C. Lee, Y.-R. Shiau, Y.-H. Chung, L. Ding, \"Single-Machine Scheduling to Minimize Total Completion Time and Tardiness with Two Competing Agents,\" *The Scientific World Journal*, Volume 2014, Article ID 596306, 9 pages。\n- DOI：10.1155/2014/596306；檔案：`raw/TSWJ2014-596306.pdf`；開放取用（Creative Commons Attribution License）。\n\n## 一句話\n\n一台機器要同時服務兩個代理人（agent）的工作：第一個代理人希望自己的工作早完成、少延遲，第二個代理人要求自己的工作一件都不能延遲；本文用 branch-and-bound 求最佳解，並用兩種模擬退火求近似解 [TSWJ2014 Abstract]。\n\n> 定位說明：本篇全文沒有資源限制，也沒有提到 relocation problem [TSWJ2014 全文]。依使用者的決定，它在本 Wiki 是獨立的分支，只透過單機排程、完工時間、NP-hard 等共通概念與其他頁面相連。\n\n## 問題設定\n\n- $n$ 個工作，每個工作屬於代理人 $AG_1$ 或 $AG_2$，有加工時間 $p_j$ 與交期 $d_j$ [TSWJ2014 §2]。\n- 完工時間 $C_j$；延遲時間 $T_j=\\max\\{0, C_j-d_j\\}$；$U_j=1$ 表示工作延遲，否則為 0 [TSWJ2014 §2]。\n- 目標：讓 $AG_1$ 工作的「總延遲時間與總完工時間的加權組合」最小，條件是 $AG_2$ 的工作不得有任何延遲 [TSWJ2014 §2]。\n- 三欄記號如下，其中 $0\\le\\theta\\le 1$ 是兩個指標之間的權重 [TSWJ2014 §2]。\n\n$$1 \\;\\Big|\\; \\sum_{j\\in AG_2} U_j = 0 \\;\\Big|\\; \\sum_{j\\in AG_1} \\big(\\theta T_j + (1-\\theta) C_j\\big)$$\n\n- 作者指出，同一個代理人同時考慮多個目標的多代理人排程，在文獻中很少被討論 [TSWJ2014 §1]。\n\n## 主要內容\n\n| 主題 | 內容 | 位置 |\n|---|---|---|\n| 難度 | 沒有 $AG_2$ 的工作且 $\\theta=1$ 時，問題退化成單機總延遲時間問題，那已經是 NP-hard，所以本問題也難 | [TSWJ2014 §3] |\n| 支配性質 | 一個非相鄰的性質（Property 1）與九個相鄰兩工作的交換條件（Proposition 1–9），用來刪掉不可能最佳的分支 | [TSWJ2014 §3.1] |\n| 可行性判斷 | 把剩下的 $AG_2$ 工作依交期由早到晚接在已排好的部分後面，只要有一個會延遲，這個分支就不可行 | [TSWJ2014 Property 2] |\n| 下界 | 先把剩下的 $AG_2$ 工作盡量往後排（不延遲的前提下），再把 $AG_1$ 的工作填進空檔並允許切開，得到目標值的下界 | [TSWJ2014 §3.2] |\n| 模擬退火 | 兩個版本：$SA_1$ 遇到不可行的鄰近解就重新產生；$SA_2$ 把 $AG_2$ 的延遲乘上懲罰係數加進目標函數 | [TSWJ2014 §4] |\n| 實驗一 | $n=12$：代理人的工作比例 $P$（定義見待確認）與交期參數 $(\\tau, R)$ 都顯著影響 branch-and-bound 的節點數 | [TSWJ2014 Table 1, Table 2] |\n| 實驗二 | $n=12$：權重 $\\theta$ 對節點數沒有顯著影響（$F=0.74$，$P$ 值 0.48） | [TSWJ2014 Table 3, Table 4] |\n| 實驗三 | $n=16, 20, 24$：branch-and-bound 可在合理時間內解到 24 個工作，最耗時的一組平均 47.37 秒；作者表示兩種模擬退火的平均誤差在所有測試中都小於 1%（但表中有一組為 1.05%，見待確認） | [TSWJ2014 Table 5, §5] |\n| 實驗四 | $n=100, 200$：$SA_1$ 的相對偏差與「得到較佳解的次數」都優於 $SA_2$，作者建議工作數多時使用 $SA_1$ | [TSWJ2014 Table 6, §5] |\n\n## 實驗設定\n\n- 程式以 Fortran 90 撰寫，在 Intel Core 2 Duo T7500 2.20 GHz 的個人電腦上執行 [TSWJ2014 §5]。\n- 加工時間取 1 到 100 的均勻整數；交期取 $T(1-\\tau-R/2)$ 到 $T(1-\\tau+R/2)$ 之間的均勻整數，其中 $T$ 是全部工作的加工時間總和，$\\tau$ 是延遲因子，$R$ 是交期範圍因子 [TSWJ2014 §5]。\n- 每種參數組合隨機產生 100 個例子 [TSWJ2014 §5]。\n- 當 $P$ 較大、$R$ 較小或 $\\tau=0.75$ 時問題比較容易解，作者的解釋是 Property 2 與下界在這些情況下更有效 [TSWJ2014 §5]。\n\n## 與先前研究的關係\n\n- 多代理人排程由 Agnetis 等人以及 Baker 與 Smith 最早引入排程領域 [TSWJ2014 §1]。\n- 作者舉的應用情境：衛星通訊中不同類型的封包、運輸基礎設施的使用權、維修作業與生產工作搶機台、研發部門與製造部門共用試作工場 [TSWJ2014 §1]。\n\n## 原文符號\n\n- 原文的 $AG_1$、$AG_2$、$p_j$、$d_j$、$C_j$、$T_j$、$U_j$、$\\theta$ 本 Wiki 照用；$S$ 表示一個排程；$\\pi$ 表示已排定的部分順序。\n\n## 待確認\n\n> **待確認**：實驗參數 $P$ 的定義前後不一。第 5 節先說要研究「第二個代理人的工作比例 $P$」的影響，下一句卻說「考慮了 $AG_1$ 工作比例的三個值，即 $P=0.25, 0.5, 0.75$」。作者說 $P$ 越大越好解是因為 Property 2 更有效，而 Property 2 是關於 $AG_2$ 工作的，由此推測 $P$ 是 $AG_2$ 的比例，但這是推論，不是原文明講的 [TSWJ2014 §5]。\n\n> **待確認**：第 5 節說兩種模擬退火在 $n=100, 200$ 的所有測試中「平均執行時間都小於 1 秒」，但 Table 6 中 $n=200$ 有幾組 $SA_1$ 的平均 CPU 時間超過 1 秒（例如 1.06、1.07、1.45）[TSWJ2014 §5, Table 6]。\n\n> **待確認**：接受機率的規則寫成「當 $P(\\text{accept}) > r$ 時接受」，其中 $r$ 是 0 到 1 的均勻亂數；另外控制參數 $\\alpha = k/\\beta$ 會隨迭代次數 $k$ 變大，使接受機率變小。這兩點是依原文字面整理，細節請對照原文 [TSWJ2014 §4]。\n\n> **待確認**：第 5 節與結論都說模擬退火的平均誤差「在所有測試組合中都小於 1%」，但 Table 5 中 $(n, P, \\tau, R) = (20, 0.5, 0.25, 0.50)$ 這一組的 $SA_1$ 平均誤差是 1.05%（同一組 $SA_2$ 為 0.96%）[TSWJ2014 §5, §6, Table 5]。\n\n## 相關頁面\n\n- [[concepts/two-agent-scheduling]]\n- [[algorithms/branch-and-bound]]、[[algorithms/simulated-annealing]]\n- [[concepts/objective-functions]]、[[concepts/scheduling-basics]]、[[concepts/np-hardness]]\n- [[comparisons/complexity-table]]、[[comparisons/papers-at-a-glance]]\n"}}, "backlinks": {"sources/josh2010": ["algorithms/algorithm-w", "comparisons/complexity-table", "comparisons/papers-at-a-glance", "concepts/approximation-algorithm", "concepts/np-hardness", "concepts/objective-functions", "concepts/relocation-problem", "concepts/resource-constrained-scheduling", "further-reading/josh2010", "index", "open-questions", "overview", "queries/slides-josh2010", "sources/josh2016"], "concepts/approximation-algorithm": ["algorithms/algorithm-w", "algorithms/rounding-and-splitting", "comparisons/complexity-table", "concepts/np-hardness", "index", "queries/slides-do2006", "sources/do2006", "sources/josh2010"], "concepts/objective-functions": ["algorithms/algorithm-w", "algorithms/backward-dp", "concepts/fixed-sequence", "concepts/relocation-problem", "concepts/scheduling-basics", "concepts/two-agent-scheduling", "further-reading/josh2010", "further-reading/josh2016", "index", "queries/slides-josh2010", "sources/josh2010", "sources/josh2016", "sources/tswj2014"], "concepts/relocation-problem": ["algorithms/algorithm-w", "algorithms/johnsons-rule", "concepts/fixed-sequence", "concepts/objective-functions", "concepts/parallel-machines", "concepts/resource-constrained-scheduling", "concepts/two-agent-scheduling", "concepts/two-machine-flowshop", "further-reading/do2006", "further-reading/ejor2009", "further-reading/josh2010", "index", "overview", "queries/slides-do2006", "queries/slides-ejor2009", "queries/slides-josh2016", "sources/do2006", "sources/ejor2009", "sources/josh2010"], "concepts/fixed-sequence": ["algorithms/backward-dp", "concepts/parallel-machines", "concepts/relocation-problem", "index", "overview", "queries/slides-josh2016", "sources/josh2016"], "sources/josh2016": ["algorithms/backward-dp", "comparisons/complexity-table", "comparisons/papers-at-a-glance", "concepts/fixed-sequence", "concepts/np-hardness", "concepts/objective-functions", "concepts/parallel-machines", "concepts/reloc <script>/* 共用的顯示程式：Markdown（marked）＋ LaTeX（KaTeX）＋ [[Wiki 連結]] ＋ 圖表區塊。
   簡報與 wiki.html 都用這一份。 */
(function () {
  const PALETTE = ['#0f766e', '#b45309', '#4338ca', '#be185d', '#15803d', '#0369a1', '#7c3aed', '#a16207'];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function math(tex, display) {
    try { return katex.renderToString(tex, { displayMode: display, throwOnError: false }); }
    catch (e) { return '<code>' + esc(tex) + '</code>'; }
  }

  /* 甘特圖：{rows:[{label, bars:[{job,start,end,group?}]}], caption} */
  function gantt(d) {
    const jobs = [...new Set(d.rows.flatMap(r => r.bars.map(b => b.job)))];
    const end = Math.max(...d.rows.flatMap(r => r.bars.map(b => b.end)));
    const W = 860, L = 70, rowH = 46, top = 8, H = top + d.rows.length * rowH + 30;
    const x = t => L + t * (W - L - 12) / end;
    let s = `<svg class="diagram" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.caption || '甘特圖')}">`;
    for (let t = 0; t <= end; t++) {
      s += `<line x1="${x(t)}" y1="${top}" x2="${x(t)}" y2="${H - 24}" class="grid"/>`;
      if (end <= 24 || t % 2 === 0) s += `<text x="${x(t)}" y="${H - 8}" class="tick">${t}</text>`;
    }
    d.rows.forEach((r, i) => {
      const y = top + i * rowH + 5;
      s += `<text x="${L - 12}" y="${y + 22}" class="rowlabel">${esc(r.label)}</text>`;
      r.bars.forEach(b => {
        const c = PALETTE[(b.group ? b.group - 1 : jobs.indexOf(b.job)) % PALETTE.length];
        s += `<rect x="${x(b.start) + 1}" y="${y}" width="${x(b.end) - x(b.start) - 2}" height="${rowH - 12}" rx="5" fill="${c}"/>`;
        s += `<text x="${(x(b.start) + x(b.end)) / 2}" y="${y + 22}" class="barlabel">${esc(b.job)}</text>`;
      });
    });
    s += '</svg>';
    return `<figure>${s}${d.caption ? `<figcaption>${esc(d.caption)}</figcaption>` : ''}</figure>`;
  }

  /* 資源水位圖：{v0, steps:[{job,alpha,beta,before,during,after}], caption} */
  function levels(d) {
    const max = Math.max(d.v0, ...d.steps.flatMap(s => [s.before, s.after]));
    const W = 860, L = 56, H = 250, top = 22, bot = 44, n = d.steps.length;
    const x = i => L + i * (W - L - 20) / n, y = v => top + (H - top - bot) * (1 - v / max);
    let s = `<svg class="diagram" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.caption || '資源水位圖')}">`;
    for (let v = 0; v <= max; v++) {
      s += `<line x1="${L}" y1="${y(v)}" x2="${W - 20}" y2="${y(v)}" class="grid"/><text x="${L - 10}" y="${y(v) + 5}" class="rowlabel">${v}</text>`;
    }
    let path = `M ${x(0)} ${y(d.steps[0].before)}`;
    d.steps.forEach((st, i) => {
      const c = PALETTE[i % PALETTE.length];
      s += `<rect x="${x(i) + 3}" y="${H - bot + 8}" width="${x(i + 1) - x(i) - 6}" height="26" rx="5" fill="${c}"/>`;
      s += `<text x="${(x(i) + x(i + 1)) / 2}" y="${H - bot + 26}" class="barlabel">${esc(st.job)}（−${st.alpha}，+${st.beta}）</text>`;
      path += ` L ${x(i)} ${y(st.during)} L ${x(i + 1)} ${y(st.during)} L ${x(i + 1)} ${y(st.after)}`;
      s += `<text x="${(x(i) + x(i + 1)) / 2}" y="${y(st.during) - 8}" class="tick">${st.during}</text>`;
      s += `<circle cx="${x(i + 1)}" cy="${y(st.after)}" r="4" class="dot"/><text x="${x(i + 1) - 4}" y="${y(st.after) - 9}" class="tick strong">${st.after}</text>`;
    });
    s += `<circle cx="${x(0)}" cy="${y(d.steps[0].before)}" r="4" class="dot"/><text x="${x(0) + 6}" y="${y(d.steps[0].before) - 9}" class="tick strong">${d.steps[0].before}</text>`;
    s += `<path d="${path}" class="level"/></svg>`;
    return `<figure>${s}${d.caption ? `<figcaption>${esc(d.caption)}</figcaption>` : ''}</figure>`;
  }

  /* opts.link(target, label) 回傳 [[連結]] 的 href；opts.cite(sourceId) 回傳來源標註的 href（可省略）。 */
  window.renderMarkdown = function (src, opts) {
    opts = opts || {};
    const stash = [];
    const keep = html => { stash.push(html); return '⟦' + (stash.length - 1) + '⟧'; };

    src = src.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
      if (lang === 'gantt' || lang === 'levels') {
        try { return '\n\n' + keep((lang === 'gantt' ? gantt : levels)(JSON.parse(code))) + '\n\n'; }
        catch (e) { return '\n\n' + keep('<pre class="err">圖表資料有誤：' + esc(e.message) + '</pre>') + '\n\n'; }
      }
      return '\n\n' + keep('<pre><code>' + esc(code) + '</code></pre>') + '\n\n';
    });
    src = src.replace(/`([^`\n]+)`/g, (m, code) => keep('<code>' + esc(code) + '</code>'));
    src = src.replace(/\$\$([\s\S]+?)\$\$/g, (m, tex) => keep(math(tex.trim(), true)));
    src = src.replace(/\$([^$\n]+?)\$/g, (m, tex) => keep(math(tex, false)));
    src = src.replace(/\[\[([^\]|#\\]+)(?:\\?\|([^\]]*))?\]\]/g, (m, target, label) => {
      const t = target.trim();
      const text = label || (opts.title ? opts.title(t) : t);
      return keep(`<a class="wikilink" href="${esc(opts.link ? opts.link(t) : '#' + t)}">${esc(text)}</a>`);
    });
    src = src.replace(/\[((?:DO|EJOR|JOSH|TSWJ)\d{4})(\s+[^\]\[]*)?\]/g, (m, id, where) => {
      const label = esc(id + (where || ''));
      return keep(opts.cite ? `<a class="cite" href="${esc(opts.cite(id))}">${label}</a>` : `<span class="cite">${label}</span>`);
    });

    let html = marked.parse(src, { gfm: true, breaks: false });
    html = html.replace(/<p>⟦(\d+)⟧<\/p>/g, (m, i) => stash[+i]);
    for (let pass = 0; pass < 3; pass++) html = html.replace(/⟦(\d+)⟧/g, (m, i) => stash[+i]);
    html = html.replace(/<blockquote>\s*<p><strong>待確認<\/strong>/g, '<blockquote class="todo"><p><strong>待確認</strong>');
    return html.replace(/<table>/g, '<div class="tablewrap"><table>').replace(/<\/table>/g, '</table></div>');
  };
})();
</script>
<script>
const DATA = JSON.parse(document.getElementById('wiki-data').textContent);
const titleOf = id => (DATA.pages[id] && DATA.pages[id].meta.title) || id;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function nav(filter) {
  const f = (filter || '').toLowerCase();
  let html = '';
  for (const [type, label] of DATA.groups) {
    const ids = Object.keys(DATA.pages).filter(id => DATA.pages[id].meta.type === type &&
      (!f || (titleOf(id) + id + DATA.pages[id].body).toLowerCase().includes(f)));
    if (!ids.length) continue;
    html += `<h2>${label}（${ids.length}）</h2><ul>` + ids.map(id => `<li><a href="#${id}" data-id="${id}">${esc(titleOf(id))}</a></li>`).join('') + '</ul>';
  }
  document.getElementById('nav').innerHTML = html || '<p class="sub">找不到符合的頁面</p>';
  mark();
}
function mark() {
  const id = current();
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === id));
}
const current = () => decodeURIComponent(location.hash.slice(1)) || 'overview';
function show() {
  const id = current(), page = DATA.pages[id], main = document.querySelector('main');
  if (!page) { main.innerHTML = `<h1>找不到頁面</h1><p>${esc(id)}</p>`; return; }
  const m = page.meta;
  let body = page.body;
  if (m.type === 'query' && m.deck) {   // 簡報稿：把 kind:: / wiki:: 兩行顯示成小字
    body = body.replace(/^kind:: *(.*)\nwiki:: *(.*)$/gm, (x, kind, wiki) => `<p class="slidemeta">教學角色：${kind}　出處：${wiki}</p>`);
  }
  const pills = [];
  if (m.type) pills.push(`<span class="pill type">${esc((DATA.groups.find(g => g[0] === m.type) || [,m.type])[1])}</span>`);
  if (m.status) pills.push(`<span class="pill ${m.status === '已確認' ? '' : 'draft'}">${esc(m.status)}</span>`);
  (m.sources || []).forEach(s => pills.push(`<a class="pill" href="#sources/${s.toLowerCase()}">${esc(s)}</a>`));
  if (m.updated) pills.push(`<span class="pill">更新 ${esc(m.updated)}</span>`);
  if (m.deck) pills.push(`<a class="pill" href="slides/${esc(m.deck)}.html" target="_blank">開啟這份簡報 ↗</a>`);
  const back = (DATA.backlinks[id] || []).map(b => `<a href="#${b}">${esc(titleOf(b))}</a>`).join('');
  main.innerHTML = `<div class="meta">${pills.join('')}</div><h1>${esc(m.title || id)}</h1><article>` +
    renderMarkdown(body, { link: t => '#' + t, title: titleOf, cite: s => '#sources/' + s.toLowerCase() }) +
    `</article>` + (back ? `<div class="back">連到這一頁的頁面：<br>${back}</div>` : '');
  document.title = (m.title || id) + '｜排程論文 LLM Wiki';
  mark(); window.scrollTo(0, 0);
}
document.getElementById('q').addEventListener('input', e => nav(e.target.value));
window.addEventListener('hashchange', show);
nav(''); show();
</script>
