<script id="wiki-data" type="application/json">{"pages": {"algorithms/algorithm-w": {"meta": {"title": "Algorithm W：輪流看「重要」與「會生資源」", "type": "algorithm", "sources": ["JOSH2010"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 適用的問題\n\n單機 relocation problem 最小化總加權完工時間 $\\sum w_iC_i$，限定每個工作工時為 1 且淨貢獻非負（$\\alpha_i\\le\\beta_i$）[JOSH2010 §3]。透過問題等價，也能用在淨貢獻非正、權重都是 1 的情形 [JOSH2010 §3]。\n\n## 想法\n\n一個工作值得先做，有兩種理由：它比較重要（$w_i$ 大），或它能生出比較多資源（$\\delta_i$ 大）讓別的工作可以開始。Algorithm W 兩個理由輪流用 [JOSH2010 §3]。\n\n## 步驟\n\n1. 準備兩份名單：$\\pi_1$ 依權重 $w_i$ 由大到小排，$\\pi_2$ 依淨貢獻 $\\delta_i$ 由大到小排 [JOSH2010 §3]。\n2. 一個工作「可以做」，是指它的取用量不超過目前的資源量 [JOSH2010 §3]。\n3. 第 1 個位置：從 $\\pi_1$ 由前往後找第一個可以做的工作，排進去，並從兩份名單刪掉它，更新資源量 [JOSH2010 §3]。\n4. 第 2 個位置：改從 $\\pi_2$ 找第一個可以做的工作 [JOSH2010 §3]。\n5. 之後奇數位置看 $\\pi_1$、偶數位置看 $\\pi_2$，輪流直到排完；任何時候找不到可以做的工作，就回報沒有可行排程 [JOSH2010 §3]。\n\n每個位置最多掃過整份名單一次，共 $n$ 個位置，所以執行時間是 $O(n^2)$ [JOSH2010 §3]。\n\n## 保證\n\n| 性質 | 內容 | 出處 |\n|---|---|---|\n| 可行性 | 演算法排不出來，就代表真的沒有可行排程 | [JOSH2010 Lemma 1] |\n| 資源不落後 | 最佳排程做完前 $t$ 個工作時的資源量，不會超過 Algorithm W 做完前 $2t$ 個工作時的資源量 | [JOSH2010 Lemma 2] |\n| 近似比 | 總加權完工時間不超過最佳值的 2 倍 | [JOSH2010 Thm 4] |\n\n直觀上，Algorithm W 每兩個位置就有一個是在追資源、一個是在追權重，所以重要的工作頂多被往後擠到兩倍遠的位置（推論）。\n\n## 小例子：原文的 4 個工作\n\n原文給的例子：$v_0=0$，四個工作工時都是 1 [JOSH2010 §2]。\n\n| 工作 | $J_1$ | $J_2$ | $J_3$ | $J_4$ |\n|---|---|---|---|---|\n| 權重 $w_i$ [JOSH2010 §2] | 1 | 1 | 1 | 5 |\n| 取用 $\\alpha_i$ [JOSH2010 §2] | 0 | 0 | 0 | 10 |\n| 歸還 $\\beta_i$ [JOSH2010 §2] | 2 | 3 | 5 | 10 |\n\n- WSPT 會想先做權重最大的 $J_4$，但它要 10 單位資源，一開始池子是空的，做不了 [JOSH2010 §2]。\n- 若不管資源硬照 WSPT 做，$\\sum w_iC_i$ 會是 14；但實際上必須先做完 $J_1$、$J_2$、$J_3$ 才湊得到 10 單位，可行排程的最佳值是 26（自編例子 E2）。\n\nAlgorithm W 的逐步執行（自編例子 E2）：\n\n| 位置 | 看哪份名單 | 選到 | 做之前的資源 | 做之後的資源 |\n|---|---|---|---|---|\n| 1（自編例子 E2） | $\\pi_1$（權重）：$J_4$ 做不了，往後找 | $J_1$ | 0 | 2 |\n| 2（自編例子 E2） | $\\pi_2$（貢獻） | $J_3$ | 2 | 7 |\n| 3（自編例子 E2） | $\\pi_1$（權重）：$J_4$ 還是做不了 | $J_2$ | 7 | 10 |\n| 4（自編例子 E2） | $\\pi_2$（貢獻） | $J_4$ | 10 | 10 |\n\n得到順序 J1→J3→J2→J4，$\\sum w_iC_i = 26$，在這個例子剛好就是最佳值（自編例子 E2）。\n\n## 緊例：2 倍是分析的極限\n\n原文的例子：$n$ 為偶數，$v_0=0$；前一半的工作 $\\alpha_i=\\beta_i=0$、$w_i=1$，後一半的工作 $\\alpha_i=0$、$\\beta_i=1$、$w_i=0$ [JOSH2010 §3]。Algorithm W 會把兩種工作交錯排，有權重的工作落在第 1、3、5… 個位置；最佳排法是先把有權重的工作全部做完 [JOSH2010 §3]。\n\n| $n$ | Algorithm W | 最佳值 | 比值 |\n|---|---|---|---|\n| 4（自編例子 E3） | 4 | 3 | 1.333 |\n| 6（自編例子 E3） | 9 | 6 | 1.5 |\n| 8（自編例子 E3） | 16 | 10 | 1.6 |\n| 100（自編例子 E3） | 2500 | 1275 | 1.961 |\n\n$n$ 越大比值越接近 2，與原文的極限結論一致 [JOSH2010 §3]。\n\n> **待確認**：原文印 Algorithm W 在這個例子的值為 $(n^2-n)/4$，但上表實際算出來的是 $n^2/4$（$n=6$ 時為 9）。詳見 [[sources/josh2010]]。\n\n## 相關頁面\n\n- [[sources/josh2010]]\n- [[concepts/approximation-algorithm]]、[[concepts/objective-functions]]、[[concepts/relocation-problem]]\n"}, "algorithms/backward-dp": {"meta": {"title": "排程區塊與動態規劃（BDP-1、BDP-2、FDP）", "type": "algorithm", "sources": ["JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 適用的問題\n\n兩台專用機、加工順序固定的 relocation problem，要決定每個工作的開始時間 [JOSH2016 §2]。\n\n## 想法\n\n動態規劃的精神是「大問題的最佳解由小問題的最佳解組成」。這裡的小問題是：兩台機器各自只剩後面幾個工作時，最好能排成什麼樣子。從最後面的工作開始，一步一步往前把工作接上去，每一步只記住最好的結果（白話說明）。\n\n## 狀態與排程區塊\n\n- 狀態 $(i, j)$ 表示 $M_1$ 還剩第 $i$ 個以後的工作、$M_2$ 還剩第 $j$ 個以後的工作；$g(i,j)$ 是把這些工作排完的最佳目標值 [JOSH2016 §3]。\n- 進入狀態 $(i,j)$ 時的資源量是確定的：初始資源加上前面已經做完的工作的淨貢獻總和，跟前面怎麼排無關 [JOSH2016 §3]。\n- 一個最佳排程可以在「兩台機器同時開始新工作」或「一台開始新工作而另一台閒置」的時間點切開，切出來的每一段叫排程區塊 [JOSH2016 §3]。\n\n往前接一個區塊時只有三種情形 [JOSH2016 §3, Fig. 3]：\n\n| 情形 | 接上的區塊 | 之後的狀態 |\n|---|---|---|\n| 1 [JOSH2016 §3] | 只有 $M_1$ 的一個工作，$M_2$ 等待 | $(i+1, j)$ |\n| 2 [JOSH2016 §3] | 只有 $M_2$ 的一個工作，$M_1$ 等待 | $(i, j+1)$ |\n| 3 [JOSH2016 §3] | 兩台機器同時開始，之後各自連續做幾個工作、彼此重疊的一整段 | 兩台機器都往後跳過這一段的工作 |\n\n第三種區塊有四個條件：兩台機器的第一個工作同時開始；區塊內沒有閒置；除了開頭之外沒有兩個工作同時開始；兩邊的最後一個工作互相重疊 [JOSH2016 §3]。每接上一個工作都要檢查當時的資源夠不夠 [JOSH2016 §3]。\n\n## 步驟（BDP-1）\n\n1. 對每一個 $(i,j)$，先列出所有可行的第三種區塊；每次在加工時間總和較短的那台機器上多接一個工作，直到資源不夠或兩邊剛好同時結束為止 [JOSH2016 §3]。\n2. 從兩台機器都沒有工作的狀態開始，由後往前計算每個 $g(i,j)$ [JOSH2016 §3]。\n3. 每個狀態比較三種情形，取最好的一個；資源不夠的情形視為不可行 [JOSH2016 Eq. (2)]。\n4. $g(1,1)$ 就是答案，再回頭追蹤每一步的選擇，得到整個排程 [JOSH2016 §3]。\n\n狀態有 $O(n_1n_2)$ 個，每個狀態最多檢查 $O(n_1+n_2)$ 個區塊，所以總時間是 $O(n_1n_2(n_1+n_2))$ [JOSH2016 Thm 1]。\n\n## 三種演算法\n\n| 演算法 | 目標 | 多記了什麼 | 時間 | 出處 |\n|---|---|---|---|---|\n| BDP-1（由後往前） | $C_{\\max}$、$\\sum w_jC_j$、$L_{\\max}$ | 不用多記 | $O(n_1n_2(n_1+n_2))$ | [JOSH2016 Thm 1] |\n| BDP-2（由後往前） | $\\sum w_jT_j$、$\\sum w_jU_j$ | 子排程前面已經過了多少時間 | $O(n_1n_2(n_1+n_2)\\min\\{P_1,P_2\\})$，pseudo-polynomial | [JOSH2016 Thm 4] |\n| FDP（由前往後） | $\\sum U_j$ | 目前最多有幾個工作延遲 | $O(n_1^2n_2^2(n_1+n_2)^2)$ | [JOSH2016 Thm 5] |\n\n為什麼前三個目標不用多記：把一段子排程整個往後挪，這三個目標的值只會加上一個固定的量，原本比較好的子排程挪了之後還是比較好 [JOSH2016 Property 1]。延遲時間與是否延遲則跟「實際幾點完成」有關，往後挪可能讓原本準時的工作變成延遲，所以必須把時間記進狀態 [JOSH2016 §4]。\n\nFDP 的巧思是反過來記：延遲工作數最多只有 $n_1+n_2$ 種可能，所以把它當作狀態，改成記「在最多延遲這麼多個的前提下，最快什麼時候做完」[JOSH2016 §5]。\n\n## 小例子\n\n[[concepts/fixed-sequence]] 的例子中，兩台機器各有 3 個工作，初始資源 4；最小 makespan 是 9，而不管資源的話是 7（自編例子 E5）。在總完工時間最小的排程裡，a1 與 b1 在時間 0 同時開始，是第三種區塊的開頭；時間 5 才開始的 b2 則是在 $M_1$ 剛做完 a2 時單獨開始（自編例子 E5）。\n\n## 相關頁面\n\n- [[sources/josh2016]]\n- [[concepts/fixed-sequence]]、[[concepts/objective-functions]]、[[concepts/np-hardness]]\n"}, "algorithms/branch-and-bound": {"meta": {"title": "Branch-and-bound（分支定界法）", "type": "algorithm", "sources": ["TSWJ2014"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 適用的問題\n\n要找「保證最佳」的解，但問題是 NP-hard、沒有快速公式可用的時候。TSWJ2014 用它來解雙代理人單機排程 [TSWJ2014 §3]。\n\n## 想法\n\n把所有可能的順序想成一棵樹：第一層決定第一個做誰，第二層決定第二個做誰，依此類推。全部走完就是窮舉。Branch-and-bound 的重點是「提早放棄」：只要能確定某個分支底下不可能有更好的解，就整枝剪掉（白話說明）。\n\n## 剪枝的三種依據\n\n### 1. 支配性質：這樣排一定不會比較好\n\n- Property 1：兩個 $AG_1$ 的工作 $i$、$j$，如果 $i$ 的交期不晚於 $j$、加工時間又比 $j$ 短，那麼最佳排程中 $i$ 一定在 $j$ 前面 [TSWJ2014 Property 1]。\n- Proposition 1–9：針對相鄰的兩個工作，列出九種條件，滿足時把兩者對調不會變好，因此只需要保留其中一種順序 [TSWJ2014 §3.1]。\n\n### 2. 可行性：這樣排下去 $AG_2$ 一定會延遲\n\n把還沒排的 $AG_2$ 工作依交期由早到晚（EDD）直接接在已排好的部分後面；這已經是對它們最有利的排法，如果還是有工作超過交期，這個分支就不可能可行 [TSWJ2014 Property 2]。\n\n另外，如果把剩下的工作排成「$AG_1$ 依 SPT、接著 $AG_2$ 依 EDD」而 $AG_2$ 都沒有延遲，這個排法就支配同一分支下的其他排法，不必再往下展開 [TSWJ2014 Property 3]。\n\n### 3. 下界：這個分支最好也就這樣\n\n1. 第一階段：把剩下的 $AG_2$ 工作在不延遲的前提下盡量往後排，算出它們最晚的開始時間 [TSWJ2014 §3.2]。\n2. 第二階段：把剩下的 $AG_1$ 工作依 SPT 填進機器的空檔，並且允許把工作切開；再把這些完工時間與依 EDD 排序的交期配對，算出目標值 [TSWJ2014 §3.2]。\n3. 這樣算出來的值不會比這個分支下任何真正的排程差，所以是下界；如果下界已經不比目前找到的最好解好，就剪掉 [TSWJ2014 §3.2]。\n\n## 實驗觀察\n\n| 觀察 | 內容 | 出處 |\n|---|---|---|\n| 可解的規模 | 24 個工作以內可在合理時間內求得最佳解 | [TSWJ2014 §5, §6] |\n| 成長速度 | 節點數與執行時間隨工作數呈指數成長，因為問題是 NP-hard | [TSWJ2014 §5] |\n| 最耗時的一組 | $(n, P, \\tau, R) = (24, 0.25, 0.5, 0.75)$，平均 47.37 秒 | [TSWJ2014 §5, Table 5] |\n| 什麼時候比較好解 | $P$ 較大、$R$ 較小或 $\\tau=0.75$ 時，因為 Property 2 與下界更有效 | [TSWJ2014 §5] |\n| 權重 $\\theta$ | 對節點數沒有顯著影響 | [TSWJ2014 Table 4] |\n\n## 小例子\n\n在 [[concepts/two-agent-scheduling]] 的五個工作例子中，如果第一個位置排 a1（3 單位時間）、第二個位置排 a3（5 單位時間），b1 最快也要到時間 12 才完成，超過交期 6；依 Property 2，這個分支連同底下的所有排法可以直接剪掉（自編例子 E6；推論）。該例的最佳解是 a2→b1→a1→b2→a3，目標值 18（自編例子 E6）。\n\n## 相關頁面\n\n- [[sources/tswj2014]]\n- [[concepts/two-agent-scheduling]]、[[concepts/np-hardness]]\n- [[algorithms/simulated-annealing]]\n"}, "algorithms/johnsons-rule": {"meta": {"title": "Johnson's rule", "type": "algorithm", "sources": ["EJOR2009"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 適用的問題\n\n二機流程工廠最小化 makespan（$F2\\mid\\mid C_{\\max}$），以及與它等價的單一工作隊 relocation problem 求最小初始資源量 [EJOR2009 §1, §5]。\n\n## 規則\n\n對任兩個工作 $J_i$、$J_j$，若 $\\min\\{p_i, q_j\\} \\le \\min\\{q_i, p_j\\}$，就把 $J_i$ 排在 $J_j$ 前面 [EJOR2009 §1]。\n\n## 兩種執行方式\n\n### Form 1（教科書常見的寫法）\n\n1. 在所有還沒排的工序中，找出加工時間最短的那一個 [EJOR2009 §1]。\n2. 如果它是第一台機器的工序，把這個工作排到目前最前面的空位；如果是第二台機器的工序，排到目前最後面的空位 [EJOR2009 §1]。\n3. 把這個工作移除，重複到全部排完 [EJOR2009 §1]。\n\n### Form 2（分兩組排序）\n\n1. 把工作分成兩組：$p_i \\le q_i$ 的一組，$p_i > q_i$ 的一組 [EJOR2009 §1]。\n2. 第一組依 $p_i$ 由小到大排，第二組依 $q_i$ 由大到小排 [EJOR2009 §1]。\n3. 第一組在前、第二組在後接起來 [EJOR2009 §1]。\n\n兩種方式都需要排序，所以時間複雜度是 $O(n\\log n)$ [EJOR2009 §1]。\n\n## 用 relocation problem 來理解 Form 2\n\n把每個工作想成一個投資專案，要先投入 $\\alpha_i$、完成後回收 $\\beta_i$，目標是讓起始資金最少 [EJOR2009 §5]。\n\n- 不賠錢的專案（$\\beta_i \\ge \\alpha_i$）先做，依投入金額 $\\alpha_i$ 由小到大 [EJOR2009 §5]。\n- 會賠錢的專案（$\\beta_i < \\alpha_i$）後做，依回收金額 $\\beta_i$ 由大到小 [EJOR2009 §5]。\n- 為什麼這樣排合理：門檻低又會賺的先做，賺到的錢可以拿去做門檻高的；回收最少的留到最後，因為最後一個專案回收多少已經不影響別的專案。這兩句理由是本 Wiki 的解讀，原文只給出排法（推論）。\n\n## 小例子\n\n四個工作的 $(p_i, q_i)$：A (3, 5)、B (6, 2)、C (2, 4)、D (5, 4)（自編例子 E1）。\n\n1. 分組：A、C 屬於 $p_i \\le q_i$；B、D 屬於 $p_i > q_i$（自編例子 E1）。\n2. 第一組依 $p_i$ 由小到大：C (2)、A (3)。第二組依 $q_i$ 由大到小：D (4)、B (2)（自編例子 E1）。\n3. 接起來得到 C→A→D→B，makespan 為 18；若照 A→B→C→D 做則是 20（自編例子 E1）。\n4. 換成 relocation problem 來看，同一個順序需要的最小初始資源量是 3，把 24 種順序全部試過也找不到更小的（自編例子 E1）。\n\n```gantt\n{\"example\": \"E1-flowshop\", \"rows\": [{\"label\": \"M1\", \"bars\": [{\"job\": \"C\", \"start\": 0, \"end\": 2}, {\"job\": \"A\", \"start\": 2, \"end\": 5}, {\"job\": \"D\", \"start\": 5, \"end\": 10}, {\"job\": \"B\", \"start\": 10, \"end\": 16}]}, {\"label\": \"M2\", \"bars\": [{\"job\": \"C\", \"start\": 2, \"end\": 6}, {\"job\": \"A\", \"start\": 6, \"end\": 11}, {\"job\": \"D\", \"start\": 11, \"end\": 15}, {\"job\": \"B\", \"start\": 16, \"end\": 18}]}], \"caption\": \"Johnson 順序 C→A→D→B：makespan 18，M2 閒置共 3\"}\n```\n\n## 為什麼是對的\n\n標準的證明是交換論證：假設最佳順序中有兩個相鄰的工作違反規則，把它們對調後 makespan 不會變大 [EJOR2009 §3]。原文另外用 [[concepts/composite-job]] 把論證推廣到不相鄰的兩個工作，並在 relocation problem 的情境下分三種情形說明對調後仍然可行 [EJOR2009 §3, §5]。\n\n## 相關頁面\n\n- [[concepts/two-machine-flowshop]]、[[concepts/composite-job]]、[[concepts/relocation-problem]]\n- [[sources/ejor2009]]\n"}, "algorithms/rounding-and-splitting": {"meta": {"title": "Rounding 與 Splitting：多個工作隊的近似演算法", "type": "algorithm", "sources": ["DO2006"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 適用的問題\n\n多個相同工作隊、每個工作工時為 1 的 relocation problem，目標是 makespan 最小 [DO2006 §5]。Rounding 處理工作隊數不限的情形，Splitting 再把結果調整成只有 $m$ 個工作隊 [DO2006 Thm 4, Thm 5]。\n\n## 想法\n\n直接找最佳解太難，所以分三步走：先假裝工作可以切成小片段（放寬），這樣很好解；再把被切開的工作補回完整的；最後把太擠的時段拆開（白話說明）。\n\n## 步驟\n\n### 第一步：放寬問題的貪婪解（Greedy Algorithm 1、2）\n\n1. 假設一個工作可以切成片段，分散在幾個時段裡做；片段佔多少比例，就取用與歸還多少比例的資源 [DO2006 §5]。\n2. 從第一個時段開始，在目前資源夠用的工作中，挑選能讓「歸還的資源總量」最大的組合。這是一個 fractional knapsack 問題，依 $\\beta_i/\\alpha_i$ 由大到小依序裝入即可 [DO2006 §5, Prop. 2]。\n3. 更新資源量，進入下一個時段，直到沒有片段可以排 [DO2006 §5]。\n4. 淨貢獻非負的工作這樣排就是放寬問題的最佳解 [DO2006 Lemma 2]。\n5. 有淨貢獻為負的工作時，把工作分成兩組：非負的先排；負的那一組用鏡射（$\\alpha$、$\\beta$ 對調、時間反轉）變成非負的來排，再反轉回來接在後面 [DO2006 §5, Lemma 3]。\n6. 放寬問題的最佳值是原問題最佳值的下界 [DO2006 §5]。\n\n### 第二步：Rounding Algorithm\n\n1. 找出被切成片段的工作 [DO2006 §5]。\n2. 對每個這樣的工作，在它第一個片段所在的時段旁邊插入一個新時段，把它完整地排進去（淨貢獻為負的工作改看最後一個片段）[DO2006 §5]。\n3. 刪掉空的時段 [DO2006 §5]。\n\n### 第三步：Splitting Algorithm\n\n1. 檢查每個時段排了幾個工作 [DO2006 §5]。\n2. 某個時段的工作數 $n_t$ 超過 $m$ 時，把它拆成 $\\lceil n_t/m\\rceil$ 個連續時段，前面每個時段各放 $m$ 個，後面的工作順延 [DO2006 §5]。\n\n## 保證\n\n| 演算法 | 問題 | 近似比 | 出處 |\n|---|---|---|---|\n| Rounding | $RP_\\infty$ | 2 | [DO2006 Thm 4] |\n| Splitting | $m$ 台相同機器的 $RP$ | $3-2/m$ | [DO2006 Thm 5] |\n\n兩個近似比都是緊的：原文構造的例子中，最佳值是 $km$，Rounding 得到 $2km-1$，Splitting 得到 $k(3m-2)-1$ [DO2006 §5]。$m=2$ 時 $3-2/m$ 等於 2，$m$ 很大時趨近 3（推論）。\n\n## 小例子\n\n六個工時為 1 的工作，(取用, 歸還) 為 A (2, 3)、B (2, 3)、C (3, 4)、D (4, 6)、E (5, 6)、F (6, 8)，初始資源 4（自編例子 E4）。\n\n| 階段 | 結果 | 時段數 |\n|---|---|---|\n| 放寬問題的貪婪解 | 時段 1：A、B；時段 2：D 與 2/3 個 C；時段 3：1/3 個 C、F 與 1/3 個 E；時段 4：2/3 個 E（自編例子 E4） | 4 |\n| Rounding | C 與 E 被切開，各自補成完整的一個時段：{A, B}、{D}、{C}、{F}、{E}（自編例子 E4） | 5 |\n| Splitting（$m=2$） | 沒有任何時段超過 2 個工作，不需要拆，維持 5 個時段（自編例子 E4） | 5 |\n| 窮舉的最佳解 | 兩個工作隊或不限工作隊都是 {A, B}、{C}、{F}、{D, E}（自編例子 E4） | 4 |\n\n這個例子中近似解是 5、最佳解是 4，比值 1.25，在保證的 2 倍以內（自編例子 E4）。\n\n```gantt\n{\"example\": \"E4-rounded\", \"rows\": [{\"label\": \"隊 1\", \"bars\": [{\"job\": \"A\", \"start\": 0, \"end\": 1}, {\"job\": \"D\", \"start\": 1, \"end\": 2}, {\"job\": \"C\", \"start\": 2, \"end\": 3}, {\"job\": \"F\", \"start\": 3, \"end\": 4}, {\"job\": \"E\", \"start\": 4, \"end\": 5}]}, {\"label\": \"隊 2\", \"bars\": [{\"job\": \"B\", \"start\": 0, \"end\": 1}]}], \"caption\": \"Rounding 的結果（不限工作隊數）：5 個時段\"}\n```\n\n```gantt\n{\"example\": \"E4-opt-m2\", \"rows\": [{\"label\": \"隊 1\", \"bars\": [{\"job\": \"A\", \"start\": 0, \"end\": 1}, {\"job\": \"C\", \"start\": 1, \"end\": 2}, {\"job\": \"F\", \"start\": 2, \"end\": 3}, {\"job\": \"D\", \"start\": 3, \"end\": 4}]}, {\"label\": \"隊 2\", \"bars\": [{\"job\": \"B\", \"start\": 0, \"end\": 1}, {\"job\": \"E\", \"start\": 3, \"end\": 4}]}], \"caption\": \"2 個工作隊的最佳排程：4 個時段\"}\n```\n\n> **待確認**：Rounding 步驟中新時段插入的位置，原文的演算法敘述與證明寫法略有不同（見 [[sources/do2006]]）。本例由 `scripts/examples.py` 依證明的說法執行，並由程式檢查結果確實可行。\n\n## 相關頁面\n\n- [[sources/do2006]]\n- [[concepts/approximation-algorithm]]、[[concepts/parallel-machines]]\n"}, "algorithms/simulated-annealing": {"meta": {"title": "Simulated annealing（模擬退火）", "type": "algorithm", "sources": ["TSWJ2014"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 適用的問題\n\n工作數太多、branch-and-bound 跑不完，但又想要一個夠好的解的時候。TSWJ2014 用它來處理 100、200 個工作的雙代理人排程 [TSWJ2014 §4, §5]。\n\n## 想法\n\n從一個起始順序出發，每次隨機做一個小改動。變好就接受；變差也有一定機率接受，這樣才不會卡在「附近沒有更好、但其實不是最好」的地方。接受變差的機率會隨著時間越來越低，最後安定下來（白話說明）。模擬退火的優點正是可以避免困在局部最佳解 [TSWJ2014 §4]。\n\n## TSWJ2014 的做法\n\n1. **起始順序**：先把 $AG_2$ 的工作依交期由早到晚（EDD）排，再接 $AG_1$ 的工作依加工時間由短到長（SPT）[TSWJ2014 §4]。\n2. **鄰近解**：隨機挑兩個工作對調（pairwise interchange）。作者也試過「抽出後往前插」與「抽出後往後插」，初步測試中對調的效果較好 [TSWJ2014 §4]。\n3. **接受規則**：新順序較好就接受；較差時依機率 $P(\\text{accept})=\\exp(-\\alpha\\times\\Delta TC)$ 決定，其中 $\\Delta TC$ 是目標值的變化量 [TSWJ2014 Eq. (10)]。\n4. **降溫**：控制參數 $\\alpha=k/\\beta$，$k$ 是目前的迭代次數，$\\beta$ 經測試取 6000 [TSWJ2014 Eq. (11), §4]。\n5. **停止**：執行 $400n$ 次迭代，$n$ 是工作數；作者的初步測試顯示之後解已經很穩定 [TSWJ2014 §4]。\n\n## 兩個版本差在哪裡\n\n| 版本 | 怎麼處理「$AG_2$ 不可延遲」 | 出處 |\n|---|---|---|\n| $SA_1$ | 目標函數就是原本的 $\\sum_{AG_1}(\\theta T_j+(1-\\theta)C_j)$；產生的鄰近解若不可行就重新產生 | [TSWJ2014 §4] |\n| $SA_2$ | 把限制放進目標函數：加上 $\\lambda\\sum_{AG_2}T_j$ 當作懲罰，$\\lambda$ 經測試取 1000 | [TSWJ2014 §4] |\n\n## 實驗結果\n\n| 規模 | 結果 | 出處 |\n|---|---|---|\n| $n=16, 20, 24$（可與最佳解比較） | 作者表示兩個版本的平均誤差在所有測試組合中都小於 1%；表中實際有一組 $SA_1$ 為 1.05% | [TSWJ2014 Table 5, §5] |\n| $n=16$ | $SA_2$ 看起來略好，但工作數變大後趨勢不明顯 | [TSWJ2014 §5] |\n| $n=100, 200$（兩個版本互比） | $SA_1$ 的相對偏差較小，得到較佳解的次數也較多；作者建議工作數多時用 $SA_1$ | [TSWJ2014 Table 6, §5] |\n\n## 小例子\n\n在 [[concepts/two-agent-scheduling]] 的五個工作例子中，起始順序是 b1→b2→a2→a1→a3，目標值 24.5；最佳解是 a2→b1→a1→b2→a3，目標值 18（自編例子 E6）。從起始順序出發，需要把 $AG_1$ 的工作一步步往前換，而且每次對調後都要確認 $AG_2$ 沒有延遲（推論）。\n\n> **待確認**：原文對接受規則、執行時間與「誤差皆小於 1%」的敘述有三處需要對照原文，見 [[sources/tswj2014]] 的待確認事項。\n\n## 相關頁面\n\n- [[sources/tswj2014]]\n- [[concepts/two-agent-scheduling]]\n- [[algorithms/branch-and-bound]]\n"}, "comparisons/complexity-table": {"meta": {"title": "複雜度結果總表", "type": "comparison", "sources": ["DO2006", "EJOR2009", "JOSH2010", "TSWJ2014", "JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 怎麼讀這張表\n\n每一列是一個問題版本。「結果」欄的意思：多項式時間＝有快速的精確解法；NP-hard／strongly NP-hard＝沒有已知的快速精確解法（見 [[concepts/np-hardness]]）；近似比＝快速方法保證不會比最佳解差超過的倍數（見 [[concepts/approximation-algorithm]]）（白話說明）。\n\n## Relocation problem\n\n| 機器 | 條件 | 目標 | 結果 | 出處 |\n|---|---|---|---|---|\n| 單一工作隊 | 不考慮時間 | 是否可行 | 多項式時間，$O(n\\log n)$（Kaplan 與 Amir 的結果） | [DO2006 §1] |\n| 單一工作隊 | 不考慮時間 | 最小初始資源量 $v_0$ | 多項式時間，$O(n\\log n)$；等價於 $F2\\mid\\mid C_{\\max}$，用 Johnson's rule | [EJOR2009 §1, §5] |\n| 多個相同工作隊 | 一般加工時間 | $C_{\\max}$ | NP-hard（Amir 與 Kaplan 的結果） | [DO2006 §1] |\n| 2 台專用機 | UET、$\\delta_i>0$ | $C_{\\max}$ | strongly NP-hard | [DO2006 Thm 1] |\n| 2 台相同機器 | UET、$\\delta_i>0$ | $C_{\\max}$ | strongly NP-hard | [DO2006 Thm 2] |\n| 機器數不限 | UET | $C_{\\max}$ | 近似比 2（Rounding） | [DO2006 Thm 4] |\n| $m$ 台相同機器 | UET | $C_{\\max}$ | 近似比 $3-2/m$（Splitting） | [DO2006 Thm 5] |\n| 機器數不限 | UET、$\\alpha_i=\\beta_i$ | $C_{\\max}$ | 近似比不可能小於 $3/2$（除非 P = NP） | [DO2006 §2] |\n| 機器數不限 | UET、$\\alpha_i\\le\\beta_i$ | $C_{\\max}$ | 漸近近似比不可能小於 $4/3$（除非 P = NP） | [DO2006 Thm 3] |\n| 單機 | $p_i=1$、$\\delta_i\\le 0$ | $\\sum w_iC_i$ | strongly NP-hard | [JOSH2010 Thm 1] |\n| 單機 | $p_i=1$、$\\delta_i\\ge 0$ | $\\sum w_iC_i$ | strongly NP-hard；近似比 2（Algorithm W） | [JOSH2010 Thm 2, Thm 4] |\n| 單機 | $w_i=1$、$\\delta_i\\ge 0$ | $\\sum w_iC_i$ | strongly NP-hard | [JOSH2010 Cor. 1] |\n| 單機 | $w_i=1$、$\\delta_i\\le 0$ | $\\sum w_iC_i$ | strongly NP-hard；近似比 2（由等價關係） | [JOSH2010 Cor. 2, §3] |\n| 2 台專用機 | 順序不固定 | $C_{\\max}$、$\\sum C_j$、與交期有關的目標 | strongly NP-hard（由前面幾列推得） | [JOSH2016 §1] |\n| 2 台專用機 | 順序固定 | $C_{\\max}$、$\\sum w_jC_j$、$L_{\\max}$ | 多項式時間，$O(n_1n_2(n_1+n_2))$ | [JOSH2016 Thm 1] |\n| 2 台專用機 | 順序固定 | $\\sum w_jT_j$、$\\sum w_jU_j$ | NP-hard（普通意義）；pseudo-polynomial 動態規劃 | [JOSH2016 Thm 2, Thm 3, Thm 4] |\n| 2 台專用機 | 順序固定 | $\\sum U_j$ | 多項式時間，$O(n_1^2n_2^2(n_1+n_2)^2)$ | [JOSH2016 Thm 5] |\n| 2 台專用機 | 順序固定 | $\\sum T_j$ | 尚未解決 | [JOSH2016 §6] |\n| 2 台專用機 | 順序固定、加工時間都相同 | 上述六種目標 | 全部多項式時間 | [JOSH2016 §6] |\n\n## 二機流程工廠（與單一工作隊的 relocation problem 等價）\n\n| 問題 | 結果 | 出處 |\n|---|---|---|\n| $F2\\mid\\mid C_{\\max}$ | 多項式時間，$O(n\\log n)$（Johnson's rule） | [EJOR2009 §1] |\n| 交期指派問題（Birman 與 Mosheiov 提出） | 原解法 $O(n^2\\log n)$，用 composite job 降為 $O(n\\log n)$ | [EJOR2009 §2] |\n| $F2\\mid f\\mid C_{\\max}$、$F2\\mid l\\mid C_{\\max}$（首位或末位禁排） | 原解法 $O(n^2)$，用 composite job 降為 $O(n\\log n)$ | [EJOR2009 §2] |\n| $F2\\mid f,l\\mid C_{\\max}$（首末位同時禁排） | 原解法 $O(n^3)$，用 composite job 降為 $O(n^2)$ | [EJOR2009 §2] |\n\n## 雙代理人排程（獨立分支，沒有資源限制）\n\n| 問題 | 結果 | 出處 |\n|---|---|---|\n| 單機總延遲時間 $1\\mid\\mid\\sum T_j$ | NP-hard（Du 與 Leung 的結果） | [TSWJ2014 §3] |\n| $1\\mid \\sum_{AG_2}U_j=0\\mid \\sum_{AG_1}(\\theta T_j+(1-\\theta)C_j)$ | NP-hard（包含上一列為特例）；branch-and-bound 可解到 24 個工作；模擬退火用於 100、200 個工作 | [TSWJ2014 §3, §5] |\n\n## 更新紀錄\n\n- JOSH2016：新增兩台專用機、順序固定的六列。\n- TSWJ2014：新增雙代理人排程一節。\n- JOSH2010：新增單機總加權完工時間的四列。\n- EJOR2009：新增「最小初始資源量」一列與二機流程工廠一節。\n\n## 相關頁面\n\n- [[comparisons/papers-at-a-glance]]\n- [[concepts/np-hardness]]、[[concepts/approximation-algorithm]]\n- [[sources/do2006]]、[[sources/ejor2009]]、[[sources/josh2010]]、[[sources/tswj2014]]、[[sources/josh2016]]\n"}, "comparisons/papers-at-a-glance": {"meta": {"title": "五篇論文一覽", "type": "comparison", "sources": ["DO2006", "EJOR2009", "JOSH2010", "TSWJ2014", "JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 比較表\n\n| 論文 | 機器環境 | 資源限制 | 目標 | 方法 | 最重要的結果 |\n|---|---|---|---|---|---|\n| [[sources/do2006\\|DO2006]] | 多台相同機器（工作隊） | 有（relocation） | $C_{\\max}$ | 難度證明、近似演算法 | 兩台機器、UET 即為 strongly NP-hard；近似比 2 與 $3-2/m$ [DO2006 Thm 2, Thm 4, Thm 5] |\n| [[sources/ejor2009\\|EJOR2009]] | 單機（等價於二機流程工廠） | 有（relocation） | 最小初始資源量；$C_{\\max}$ | 概念介紹、composite job、交換論證 | relocation problem 的投資觀點可以直觀解釋 Johnson's rule；composite job 能降低數個相關問題的計算時間 [EJOR2009 §2, §5] |\n| [[sources/josh2010\\|JOSH2010]] | 單機 | 有（relocation） | $\\sum w_iC_i$ | 難度證明、問題等價、近似演算法 | 四個特例皆為 strongly NP-hard；Algorithm W 近似比 2 [JOSH2010 Thm 1, Thm 2, Thm 4] |\n| [[sources/tswj2014\\|TSWJ2014]] | 單機、兩個代理人 | 無 | $AG_1$ 的 $\\sum(\\theta T_j+(1-\\theta)C_j)$，$AG_2$ 不得延遲 | branch-and-bound、模擬退火、數值實驗 | 最佳解可算到 24 個工作；模擬退火誤差約在 1% 上下 [TSWJ2014 §5, Table 5] |\n| [[sources/josh2016\\|JOSH2016]] | 2 台專用機、順序固定 | 有（relocation） | 六種：$C_{\\max}$、$\\sum w_jC_j$、$L_{\\max}$、$\\sum w_jT_j$、$\\sum w_jU_j$、$\\sum U_j$ | 動態規劃、難度證明 | 四種目標多項式時間可解，兩種 NP-hard；$\\sum T_j$ 未解決 [JOSH2016 Thm 1, Thm 2, Thm 3, Thm 5] |\n\n## 五篇之間的引用關係\n\n- EJOR2009、JOSH2010、JOSH2016 都引用 DO2006 [EJOR2009 References]、[JOSH2010 §1]、[JOSH2016 §1]。\n- JOSH2016 引用 JOSH2010 [JOSH2016 §1]。\n- TSWJ2014 沒有引用其他四篇，其他四篇也沒有引用它 [TSWJ2014 References]。\n\n## 相關頁面\n\n- [[comparisons/complexity-table]]\n- [[overview]]\n"}, "concepts/approximation-algorithm": {"meta": {"title": "近似演算法與近似比", "type": "concept", "sources": ["DO2006", "JOSH2010"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n既然最佳解太難找，就退一步：設計一個跑得快的方法，並且保證它的答案「不會比最佳解差超過某個倍數」。這個倍數就是近似比（白話說明）。\n\n## 定義\n\n- $\\rho$-近似演算法：一個多項式時間的演算法，對最小化問題的任何例子 $I$，都輸出一個可行解，其 makespan 不超過 $\\rho\\times OPT(I)$ [DO2006 §2]。\n- 漸近 $\\rho$-近似演算法：存在一個常數 $c$，使得輸出的 makespan 不超過 $\\rho\\times OPT(I)+c$ [DO2006 §2]。當最佳值很大時，多出來的常數 $c$ 就不重要了（白話說明）。\n- 近似比「是緊的」，是指找得到例子讓演算法真的差到那個倍數，所以分析無法再改進 [DO2006 §5]。\n\n## 正面結果與負面結果\n\n| 問題 | 結果 | 出處 |\n|---|---|---|\n| $RP_\\infty$（機器數不限，UET） | Rounding Algorithm 的近似比為 2 | [DO2006 Thm 4] |\n| $m$ 台相同機器的 $RP$（UET） | Splitting Algorithm 的近似比為 $3-2/m$ | [DO2006 Thm 5] |\n| $RP_\\infty$，即使 $\\alpha_i=\\beta_i$、$p_i=1$ | 除非 P = NP，近似比不可能小於 $3/2$ | [DO2006 §2] |\n| $RP_\\infty$，即使 $\\alpha_i\\le\\beta_i$、$p_i=1$ | 除非 P = NP，漸近近似比不可能小於 $4/3$ | [DO2006 Thm 3] |\n| 單機 $\\sum w_iC_i$，$\\delta_i\\ge 0$、$p_i=1$ | Algorithm W 的近似比為 2，且是緊的 | [JOSH2010 Thm 4, §3] |\n| 單機 $\\sum w_iC_i$，$\\delta_i\\le 0$、$w_i=1$ | 由問題等價得到同樣的近似比 2 | [JOSH2010 §3] |\n| 單機 $\\sum w_iC_i$，另外兩個特例與一般情形 | 能否近似仍未解決 | [JOSH2010 §4] |\n\n對 $RP_\\infty$ 而言，已知做得到 2、做不到小於 $3/2$，中間還有空間（推論）。\n\n## 相關頁面\n\n- [[algorithms/rounding-and-splitting]]、[[algorithms/algorithm-w]]\n- [[concepts/np-hardness]]\n- [[sources/do2006]]、[[sources/josh2010]]\n\n## 更新紀錄\n\n- JOSH2010：新增 Algorithm W 的結果與尚未解決的情形。\n"}, "concepts/composite-job": {"meta": {"title": "Composite job（合成工作）", "type": "concept", "sources": ["EJOR2009"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n如果有一串工作已經決定要連著做，就可以把它們「打包」成一個假想的大工作。這個大工作對外的效果（讓第二台機器多等多久）和原來那一串完全一樣，但之後的計算只要處理一個工作就好（白話說明）。\n\n## 定義\n\n- 由 Kurisu 在 1976 年提出，用來處理工作之間有先後順序限制的二機流程工廠問題 [EJOR2009 Abstract, §2]。\n- 一串連續加工的工作，其 composite job 是一個人造的工作，它造成的第二台機器閒置時間，等於那一串工作依序加工所造成的閒置時間總和 [EJOR2009 §2]。\n- 把前兩個工作合成 $J^*_{1:2}$ 的公式如下，之後再把結果與下一個工作合成，依此類推 [EJOR2009 §2]。\n\n$$p^*_{1:2} = p_1 + \\max\\{0,\\ p_2 - q_1\\},\\qquad q^*_{1:2} = \\max\\{0,\\ q_1 - p_2\\} + q_2$$\n\n- $p^*_{1:k}$ 可以解讀成前 $k$ 個工作造成的第二台機器閒置時間總和 [EJOR2009 §2]。\n- 圖像上的意思是：一串工作中，第一台機器與第二台機器「同時在忙」的重疊時段可以直接削掉，不影響第二台機器的總閒置時間；削完剩下的就是 composite job [EJOR2009 §2, Fig. 1]。\n\n## 在 relocation problem 中的版本\n\n把 $p$、$q$ 換成取用量 $\\alpha$ 與歸還量 $\\beta$，同樣的遞迴式就定義了一串工作在 relocation problem 中的 composite job [EJOR2009 §5]。\n\n$$\\alpha^*_{i:j} = \\alpha^*_{i:j-1} + \\max\\{0,\\ \\alpha_j - \\beta^*_{i:j-1}\\},\\qquad \\beta^*_{i:j} = \\max\\{0,\\ \\beta^*_{i:j-1} - \\alpha_j\\} + \\beta_j$$\n\n白話地說：$\\alpha^*$ 是「這一串工作一開始至少要有多少資源」，$\\beta^*$ 是「這一串做完後手上會有多少資源」（推論）。\n\n## 有什麼用\n\n| 用途 | 效果 | 出處 |\n|---|---|---|\n| 重複計算 makespan | 把固定不動的一大段工作先合成一個，之後每換一種排法只要常數時間就能算出 makespan | [EJOR2009 §2] |\n| 交期指派問題 | 由 $O(n^2\\log n)$ 降為 $O(n\\log n)$ | [EJOR2009 §2] |\n| 首位或末位有禁排工作 | 由 $O(n^2)$ 降為 $O(n\\log n)$；兩者同時由 $O(n^3)$ 降為 $O(n^2)$ | [EJOR2009 §2] |\n| 寫證明 | 可以對不相鄰的兩個工作做交換論證 | [EJOR2009 §3] |\n\n## 小例子\n\n把 Johnson 順序 C→A→D→B 的四個工作合成一個，得到 $(p^*, q^*) = (3, 2)$；$p^*=3$ 正好是這個順序的第二台機器閒置時間，也是 relocation problem 需要的最小初始資源量（自編例子 E1）。\n\n## 相關頁面\n\n- [[concepts/two-machine-flowshop]]、[[algorithms/johnsons-rule]]\n- [[sources/ejor2009]]\n"}, "concepts/fixed-sequence": {"meta": {"title": "固定順序（Fixed sequence）：只剩「何時開始」要決定", "type": "concept", "sources": ["JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n一般的排程要決定三件事：哪個工作給哪台機器、每台機器上先做誰、每個工作幾點開始。「固定順序」是把前兩件事當作已經決定好了，只研究第三件事（白話說明）。\n\n平常第三件事很無聊：順序定了，機器一有空就接著做就好。但在 relocation problem 裡，機器有空不代表資源夠，有時候「讓這台機器先等一下、把資源留給另一台」反而比較好，所以連這一步都需要動腦（白話說明）。\n\n## 設定\n\n- 求解資源限制排程通常分成三個階段：指派機器、決定順序、決定開始時間 [JOSH2016 §1]。\n- 固定順序的問題只處理最後一個階段：兩台專用機上的加工順序都已給定，要決定每個工作的開始時間 [JOSH2016 §1, §2]。\n- 多數排程問題在順序給定後很容易算出最佳排程；這個問題不是，而且對某些目標是 NP-hard [JOSH2016 §1]。\n\n## 為什麼值得研究\n\n- 把一個很難的問題拆成幾個決策階段，單獨研究其中一個階段，可以得到對整個問題的洞察 [JOSH2016 §1]。\n- 如果「給定順序求最佳開始時間」可以快速算出，它就能當作 branch-and-bound 或啟發式搜尋的零件，用來替每個候選順序打分數 [JOSH2016 §1]。\n- 如果連這一步都是 NP-hard，就表示用「順序」來表示解的做法不夠，需要別的表示方式 [JOSH2016 §1]。\n\n## 一個有用的性質\n\n對任何 regular 的目標，存在一個最佳排程，其中每個工作的開始時間不是 0 就是某個工作的完成時間 [JOSH2016 Lemma 1]。所以不必考慮無限多種開始時間，只要考慮「接在誰後面開始」（白話說明）。\n\n## 小例子\n\n$M_1$ 的順序是 a1→a2→a3，$M_2$ 的順序是 b1→b2→b3，初始資源 4（自編例子 E5）。\n\n| 工作 | a1 | a2 | a3 | b1 | b2 | b3 |\n|---|---|---|---|---|---|---|\n| 加工時間（自編例子 E5） | 2 | 3 | 2 | 3 | 2 | 1 |\n| 取用（自編例子 E5） | 2 | 3 | 4 | 2 | 5 | 1 |\n| 歸還（自編例子 E5） | 3 | 3 | 6 | 4 | 5 | 2 |\n\n- 如果不管資源，兩台機器各自連續加工，$M_1$ 要 7、$M_2$ 要 6，makespan 是 7（自編例子 E5）。\n- 加上資源限制後，最小的 makespan 是 9，最小的總完工時間是 34（自編例子 E5）。\n- 下圖是總完工時間最小的排程，它的 makespan 也是 9。時間 3 時 b1 做完、$M_2$ 空了，但池中只有 4 單位，b2 要 5 單位，只能等到時間 5 a2 歸還資源後才開始；同樣地，a3 要等到時間 7 b2 歸還後才能開始（自編例子 E5）。\n\n```gantt\n{\"example\": \"E5-sumc\", \"rows\": [{\"label\": \"M1\", \"bars\": [{\"job\": \"a1\", \"start\": 0, \"end\": 2}, {\"job\": \"a2\", \"start\": 2, \"end\": 5}, {\"job\": \"a3\", \"start\": 7, \"end\": 9}]}, {\"label\": \"M2\", \"bars\": [{\"job\": \"b1\", \"start\": 0, \"end\": 3}, {\"job\": \"b2\", \"start\": 5, \"end\": 7}, {\"job\": \"b3\", \"start\": 7, \"end\": 8}]}], \"caption\": \"最小總完工時間 = 34，這個排程的 makespan 是 9\"}\n```\n\n## 結果一覽\n\n順序固定之後，六種目標中有四種可以在多項式時間內解決，兩種仍是 NP-hard；六種之外，不加權的總延遲時間尚未解決 [JOSH2016 Thm 1, Thm 2, Thm 3, Thm 5, §6]。完整的表見 [[comparisons/complexity-table]]，解法見 [[algorithms/backward-dp]]。\n\n## 相關頁面\n\n- [[sources/josh2016]]\n- [[concepts/parallel-machines]]、[[concepts/relocation-problem]]、[[concepts/objective-functions]]\n- [[algorithms/backward-dp]]\n"}, "concepts/np-hardness": {"meta": {"title": "NP-hard 與 strongly NP-hard", "type": "concept", "sources": ["DO2006", "JOSH2010", "TSWJ2014", "JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n說一個問題是 NP-hard，意思是目前沒有人知道能在合理時間內保證找到最佳解的方法，而且一般相信這種方法不存在。工作數一多，把所有可能都試一遍的時間會爆炸性成長（白話說明）。\n\nstrongly NP-hard 是更強的說法：即使題目裡的數字都不大，問題仍然很難。只是「普通意義下」NP-hard 的問題，有時可以用執行時間跟數字大小有關的演算法（pseudo-polynomial）解決；strongly NP-hard 的問題連這條路都走不通（白話說明）。\n\n## 怎麼證明\n\n證明的方式是「歸約」：拿一個已知很難的問題，說明只要能解眼前的排程問題，就能解那個已知的難題（白話說明）。\n\n| 已知的難題 | 被用來證明什麼 | 出處 |\n|---|---|---|\n| Numerical Matching with Target Sums（由 Numerical 3-Dimensional Matching 得到） | 兩台專用機、淨貢獻為正、UET 的 relocation problem 是 strongly NP-hard | [DO2006 Thm 1] |\n| Partition | 機器數不限時，沒有漸近近似比小於 $4/3$ 的演算法 | [DO2006 Thm 3] |\n| Ordered Numerical 3-Dimensional Matching（由 Numerical 3-Dimensional Matching 得到） | 單機、UET 的總加權完工時間問題是 strongly NP-hard | [JOSH2010 Thm 1, Thm 2] |\n| Partition | 兩台專用機、順序固定時，最小化 $\\sum w_jT_j$ 或 $\\sum w_jU_j$ 是 NP-hard（普通意義） | [JOSH2016 Thm 2, Thm 3] |\n\n## 普通意義與 strong 的差別，用一個例子看\n\n順序固定的問題中，$\\sum w_jT_j$ 是普通意義下的 NP-hard，而且有一個執行時間與加工時間總和成正比的動態規劃 [JOSH2016 Thm 2, Thm 4]。當所有工作的加工時間都相同時，這個演算法就變成多項式時間 [JOSH2016 §4]。這正是「數字不大時其實可以解」的意思；strongly NP-hard 的問題沒有這種出路（白話說明）。\n\n## 本 Wiki 收錄的難度結果\n\n完整列表見 [[comparisons/complexity-table]]。\n\n- 兩台相同機器、UET、淨貢獻為正：strongly NP-hard [DO2006 Thm 2]。原文結論把同一件事寫成 unary NP-hard，兩個說法指的是同一個性質 [DO2006 §6]。\n- 單機、最小化 $\\sum w_iC_i$：$\\delta_i\\le 0$ 或 $\\delta_i\\ge 0$ 搭配 $p_i=1$，以及 $\\delta_i\\ge 0$ 或 $\\delta_i\\le 0$ 搭配 $w_i=1$，四個特例都是 strongly NP-hard [JOSH2010 Thm 1, Thm 2, Cor. 1, Cor. 2]。\n- 後兩個特例不是另外證明的，而是由「UET 情形與單位權重情形完全等價」直接推得 [JOSH2010 Thm 3]。把一個問題轉成另一個已經知道答案的問題，是省力的常見做法（白話說明）。\n- 雙代理人單機排程：它包含單機總延遲時間問題這個已知的 NP-hard 問題作為特例（沒有第二個代理人、$\\theta=1$），所以也是 NP-hard [TSWJ2014 §3]。這是最簡單的一種難度論證：指出問題裡面藏著一個已知的難題（白話說明）。\n- 兩台專用機、順序不固定：由 DO2006 與 JOSH2010 的結果可推得最小化 makespan 與總完工時間都是 strongly NP-hard，與交期有關的目標也是 [JOSH2016 §1]。\n\n## 更新紀錄\n\n- JOSH2016：新增固定順序問題的難度結果，以及普通意義與 strong 的對照例子。\n- TSWJ2014：新增雙代理人單機排程的難度說明。\n- JOSH2010：新增單機總加權完工時間的四個難度結果與所用的歸約。\n\n## 相關頁面\n\n- [[concepts/approximation-algorithm]]、[[concepts/parallel-machines]]\n- [[sources/do2006]]、[[sources/josh2010]]、[[sources/tswj2014]]、[[sources/josh2016]]\n"}, "concepts/objective-functions": {"meta": {"title": "目標函數：排程要最佳化什麼", "type": "concept", "sources": ["DO2006", "EJOR2009", "JOSH2010", "TSWJ2014", "JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n同一批工作可以有很多種排法，要先說清楚「好」是什麼意思，才能比較哪一種排法比較好。這個衡量標準就是目標函數（白話說明）。\n\n## 本 Wiki 出現的目標函數\n\n| 名稱 | 記號 | 意思 | 用到的論文 |\n|---|---|---|---|\n| Makespan | $C_{\\max}$ | 最後一個工作完成的時間，也就是整個計畫的工期 | [DO2006 §1]、[EJOR2009 §1] |\n| 總加權完工時間 | $\\sum w_iC_i$ | 每個工作的完工時間乘上它的權重再加總；權重大的工作越早完成越好 | [JOSH2010 §1] |\n| 總完工時間 | $\\sum C_j$ | 所有工作完工時間的總和；在意的是平均多快做完 | [TSWJ2014 §2] |\n| 總延遲時間 | $\\sum T_j$ | 所有工作超過交期的時間總和 | [TSWJ2014 §2] |\n| 延遲工作數 | $\\sum U_j$ | 有幾個工作超過交期；TSWJ2014 把「等於 0」當作限制條件而不是目標 | [TSWJ2014 §2] |\n| 加權組合 | $\\sum(\\theta T_j+(1-\\theta)C_j)$ | 同時在意延遲與完工時間，用 $\\theta$ 調整兩者的比重 | [TSWJ2014 §2] |\n| 最大延遲 | $L_{\\max}$ | 所有工作中「完工時間減交期」的最大值；可以是負的 | [JOSH2016 §1, §3] |\n| 總加權延遲時間 | $\\sum w_jT_j$ | 每個工作的延遲時間乘上權重再加總 | [JOSH2016 §1] |\n| 加權延遲工作數 | $\\sum w_jU_j$ | 延遲的工作的權重總和 | [JOSH2016 §1] |\n| 最小初始資源量 | $v_0$ | relocation problem 特有：不看時間，只問最少要準備多少資源才做得完 | [EJOR2009 §5] |\n\n## Regular 的目標\n\n一個目標如果「任何工作晚一點完成，目標值都不會變好」，就稱為 regular；上表中跟完工時間、延遲有關的目標都是 [JOSH2016 §2]。這個性質保證不必故意讓工作晚開始：只要資源與機器允許，提早開始不會吃虧 [JOSH2016 Lemma 1]。\n\n## 目標不同，好用的規則也不同\n\n沒有資源限制的單機問題中，總加權完工時間用 WSPT 規則就能得到最佳解 [JOSH2010 §2]。同一個規則放到 relocation problem 就不保證可行，見 [[algorithms/algorithm-w]] 的例子 [JOSH2010 §2]。同一個固定順序的問題，換一個目標，難度就可能從多項式時間變成 NP-hard [JOSH2016 Thm 1, Thm 2]。\n\n## 相關頁面\n\n- [[concepts/relocation-problem]]\n- [[sources/do2006]]、[[sources/ejor2009]]、[[sources/josh2010]]、[[sources/tswj2014]]、[[sources/josh2016]]\n\n## 更新紀錄\n\n- JOSH2016：新增 $L_{\\max}$、加權延遲類目標與 regular 的定義。\n- TSWJ2014：新增與交期有關的目標與加權組合。\n- JOSH2010：新增總加權完工時間與 WSPT 的說明。\n- EJOR2009：補上二機流程工廠的 makespan 與「最小初始資源量」。\n"}, "concepts/parallel-machines": {"meta": {"title": "平行機器：相同機與專用機", "type": "concept", "sources": ["DO2006", "JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n「平行機器」是指有好幾台機器（或好幾個工作隊）可以同時各做一件工作。在 relocation problem 裡，就是好幾棟建物可以同時施工（白話說明）。\n\n## 兩種平行機器\n\n| 種類 | 意思 | 出處 |\n|---|---|---|\n| 相同機（identical parallel machines） | 任何工作可以交給任何一台機器，代號 $RP$ | [DO2006 §1, §4] |\n| 專用機（dedicated parallel machines） | 每個工作事先指定只能在某一台機器上做，代號 $RPD$；$RPD_m$ 表示有 $m$ 台 | [DO2006 §3]、[JOSH2016 §1] |\n\n## 為什麼多了機器反而變難\n\n- 只有一個工作隊時，可行性可以在 $O(n\\log n)$ 時間判定 [DO2006 §1]。\n- 有兩個工作隊時，即使每個工作都只花 1 單位時間、淨貢獻都為正，要讓 makespan 最小就已經是 strongly NP-hard [DO2006 Thm 2]。\n- 如果沒有資源限制，兩台專用機的問題是簡單的；加上資源限制之後才變成 strongly NP-hard [DO2006 §3, Thm 1]。\n- 機器數不限、每個工作 $\\alpha_i=\\beta_i$ 且工時為 1 時，一個時段就像一個箱子，問題等價於 Bin Packing [DO2006 §2]。\n- 專用機上如果連每台機器的加工順序都固定，問題是否變簡單要看目標函數：makespan 變成多項式時間可解，但加權的延遲類目標仍是 NP-hard [JOSH2016 Thm 1, Thm 2, Thm 3]。見 [[concepts/fixed-sequence]]。\n\n## 小例子\n\n六個工時為 1 的工作，初始資源 4（自編例子 E4）。窮舉的結果：一個工作隊要 6 個時段，兩個工作隊要 4 個時段，工作隊數不限也還是 4 個時段（自編例子 E4）。多一個工作隊並沒有讓工期減半，再多也沒有用，因為卡住進度的是資源而不是人手（自編例子 E4；推論）。若套用近似演算法，Rounding 會排出 5 個時段，細節見 [[algorithms/rounding-and-splitting]]（自編例子 E4）。\n\n## 相關頁面\n\n- [[concepts/relocation-problem]]、[[concepts/np-hardness]]、[[concepts/fixed-sequence]]\n- [[algorithms/rounding-and-splitting]]\n- [[sources/do2006]]、[[sources/josh2016]]\n\n## 更新紀錄\n\n- JOSH2016：補上 $RPD_m$ 的記號與「順序固定之後」的結果。\n"}, "concepts/relocation-problem": {"meta": {"title": "Relocation Problem（遷置問題）", "type": "concept", "sources": ["DO2006", "EJOR2009", "JOSH2010", "JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n一個城市要重建好幾棟舊公寓。每棟動工前要先把住戶搬到臨時住宅，蓋好之後新大樓又能容納一些人，可能比原本多，也可能比原本少。臨時住宅的數量有限，所以「先蓋哪一棟」會決定整個計畫做不做得下去。這個問題最早來自波士頓的公共住宅重建計畫 [DO2006 §1]。\n\n把「臨時住宅」想成一個水池裡的水：每件工作開工時要先舀走一些水，完工時再倒回一些水，倒回的量可以比舀走的多或少。只要某一刻水不夠舀，計畫就卡住（白話說明）。\n\n## 模型\n\n- 一個共用資源池，初始有 $v_0$ 單位 [DO2006 §1]。\n- 工作 $J_i$ 開始時取走 $\\alpha_i$ 單位，完成時歸還 $\\beta_i$ 單位；池中不足 $\\alpha_i$ 就不能開始 [DO2006 §1]。\n- 淨貢獻 $\\delta_i=\\beta_i-\\alpha_i$ 可正、可負、可為零 [DO2006 §1]。淨貢獻為負的工作會讓水位下降，非負的工作會讓水位上升或持平 [EJOR2009 §5]。\n- 一個排程「可行」，是指每個工作開始時資源都夠用，也就是任何時刻資源量都不為負 [DO2006 Eq. (1)]。\n\n## 它在問什麼\n\n依版本不同，問的問題也不同：\n\n| 版本 | 問題 | 出處 |\n|---|---|---|\n| 單一工作隊、不考慮時間 | 給定 $v_0$，是否存在可行的施工順序？可在 $O(n\\log n)$ 時間判定 | [DO2006 §1] |\n| 單一工作隊、不考慮時間 | 最少要準備多少初始資源 $v_0$，才保證存在可行的順序？ | [EJOR2009 §5] |\n| 多個工作隊、有加工時間 | 在資源限制下，讓 makespan 最小 | [DO2006 §1] |\n| 兩台專用機、加工順序固定 | 只決定每個工作的開始時間，分別最佳化六種目標 | [JOSH2016 §1, §2] |\n| 單一工作隊、有加工時間與權重 | 在可行的順序中，讓總加權完工時間 $\\sum w_iC_i$ 最小（RPWT） | [JOSH2010 §1] |\n\n## 單一工作隊：其實就是二機流程工廠\n\n把取用量當作第一台機器的加工時間、歸還量當作第二台機器的加工時間，那麼一個順序需要的初始資源量，就等於二機流程工廠中第二台機器的閒置時間總和 [EJOR2009 §5]。所以最省資源的順序可以直接用 [[algorithms/johnsons-rule]] 找到：不賠的工作先做、依取用量由小到大；會賠的工作後做、依歸還量由大到小 [EJOR2009 §5]。詳見 [[concepts/two-machine-flowshop]]。\n\n## 小例子\n\n四棟建物 A、B、C、D，(取用, 歸還) 分別是 (3, 5)、(6, 2)、(2, 4)、(5, 4)（自編例子 E1）。\n\n- 依 A→B→C→D 的順序，初始資源至少要 5 才不會卡住（自編例子 E1）。\n- 把 24 種順序全部試過，最少只需要 3，其中一個達到 3 的順序是 C→A→D→B；最差的順序需要 9（自編例子 E1）。\n- 同樣四棟建物，光是順序不同，需要的臨時住宅就從 3 到 9 不等（自編例子 E1）。\n- C→A→D→B 正是 Johnson's rule 排出來的順序：A、C 不賠，依取用量排成 C、A；B、D 會賠，依歸還量排成 D、B（自編例子 E1）。\n\n```levels\n{\"example\": \"E1-levels\", \"v0\": 3, \"steps\": [{\"job\": \"C\", \"alpha\": 2, \"beta\": 4, \"before\": 3, \"during\": 1, \"after\": 5}, {\"job\": \"A\", \"alpha\": 3, \"beta\": 5, \"before\": 5, \"during\": 2, \"after\": 7}, {\"job\": \"D\", \"alpha\": 5, \"beta\": 4, \"before\": 7, \"during\": 2, \"after\": 6}, {\"job\": \"B\", \"alpha\": 6, \"beta\": 2, \"before\": 6, \"during\": 0, \"after\": 2}], \"caption\": \"依 C→A→D→B 的順序，初始資源 3 就夠用\"}\n```\n\n## 加上時間之後就變難\n\n只問可不可行時，單一工作隊的問題很容易。但只要目標跟時間有關，即使只有一台機器、每個工作工時都是 1，最小化總加權完工時間就已經是 strongly NP-hard [JOSH2010 Thm 1, Thm 2]。原因之一是資源會擋住本來該先做的工作：沒有資源限制時最好的 WSPT 規則，在這裡可能排出不可行的順序 [JOSH2010 §2]。對應的近似演算法見 [[algorithms/algorithm-w]]。\n\n## 三個決策階段\n\n完整的問題要決定三件事：哪個工作給哪台機器、每台機器上的順序、每個工作的開始時間 [JOSH2016 §1]。前面幾個版本難在前兩件事；JOSH2016 指出，即使前兩件事都已經定了，光是決定開始時間，對某些目標也還是 NP-hard [JOSH2016 Thm 2, Thm 3]。見 [[concepts/fixed-sequence]]。\n\n## 應用\n\n- 除了住宅重建，也可以看成投資規劃：每個專案需要先投入資金，完成後帶回報酬，報酬可能比投入多或少 [DO2006 §1]。EJOR2009 用同樣的投資觀點來解釋 Johnson's rule [EJOR2009 §5]。\n- 原文另外提到資料庫管理方面的應用，以及財務限制排程可視為它的特例 [DO2006 §1]。\n- 與庫存限制排程有關：例如轉運站的貨車排程，卸貨的車補充庫存、裝貨的車消耗庫存，庫存不能為負 [JOSH2016 §6]。\n\n## 更新紀錄\n\n- JOSH2016：新增固定順序的版本、「三個決策階段」與庫存限制排程的關聯。\n- JOSH2010：新增總加權完工時間的版本與「加上時間之後就變難」一節。\n- EJOR2009：新增「求最小初始資源量」的版本、與二機流程工廠的等價關係，並說明小例子的最佳順序就是 Johnson 順序。\n\n## 相關頁面\n\n- [[sources/do2006]]、[[sources/ejor2009]]、[[sources/josh2010]]、[[sources/josh2016]]\n- [[concepts/resource-constrained-scheduling]]、[[concepts/parallel-machines]]、[[concepts/objective-functions]]、[[concepts/two-machine-flowshop]]、[[concepts/fixed-sequence]]\n- [[algorithms/johnsons-rule]]、[[algorithms/algorithm-w]]\n- [[comparisons/complexity-table]]\n"}, "concepts/resource-constrained-scheduling": {"meta": {"title": "資源限制排程（Resource-constrained scheduling）", "type": "concept", "sources": ["DO2006", "JOSH2010", "JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n一般的排程只問「機器什麼時候有空」。資源限制排程多了一個條件：除了機器之外，工作還需要另一種數量有限的東西（錢、空間、庫存）才能開始（白話說明）。\n\n## Relocation problem 特別在哪裡\n\n- 傳統的資源限制排程中，工作用完資源後歸還的量與取用的量相同；relocation problem 允許歸還量 $\\beta_i$ 與取用量 $\\alpha_i$ 不同，所以淨貢獻可以是正、零或負 [DO2006 §1]。\n- 也因此資源池的水位會隨著完成的工作而上升或下降，先做哪個工作會影響後面的工作能不能開始 [DO2006 §1]。\n- JOSH2010 把這一點說成：relocation problem 是傳統資源限制的推廣，因為歸還量可以小於、等於或大於取用量 [JOSH2010 §1]。\n- JOSH2016 所說的資源，指的是機器以外的東西，例如資金、住宅容量或庫存 [JOSH2016 §1]。庫存限制排程與 relocation problem 互有包含關係，視問題的定義而定 [JOSH2016 §6]。\n\n## 更新紀錄\n\n- JOSH2016：補上資源的例子與庫存限制排程。\n- JOSH2010：補上「傳統資源限制的推廣」的說法。\n\n## 相關頁面\n\n- [[concepts/relocation-problem]]\n- [[sources/do2006]]、[[sources/josh2010]]、[[sources/josh2016]]\n"}, "concepts/scheduling-basics": {"meta": {"title": "排程的基本用語與三欄記號", "type": "concept", "sources": ["EJOR2009", "TSWJ2014"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n排程問題就是在決定「哪個工作、在哪台機器、什麼時候做」。工作（job）是要完成的事，機器（machine）是做事的資源，同一台機器一次只能做一件事（白話說明）。\n\n## 基本用語\n\n| 用語 | 意思 | 出處 |\n|---|---|---|\n| 加工時間 | 一個工作在機器上需要的時間；流程工廠裡每台機器各有一個，記為 $p_i$、$q_i$ | [EJOR2009 §1] |\n| 流程工廠（flowshop） | 每個工作都要依相同的順序經過每一台機器 | [EJOR2009 §1] |\n| 順序與排程 | 排程要指定每個工作的開始時間；如果機器一有空就接著做，只要決定順序就等於決定了排程，所以兩個詞常常混用 | [EJOR2009 §1] |\n| Makespan | 全部工作完成的時間，記為 $C_{\\max}$ | [EJOR2009 §1] |\n| 交期（due date） | 工作應該完成的時間，記為 $d_j$ | [TSWJ2014 §2] |\n| 延遲時間（tardiness） | 完工時間超過交期的部分，$T_j=\\max\\{0, C_j-d_j\\}$；沒超過就是 0 | [TSWJ2014 §2] |\n| SPT 規則 | 加工時間短的先做；單機上能讓總完工時間最小 | [TSWJ2014 §4] |\n| EDD 規則 | 交期早的先做 | [TSWJ2014 §3.1] |\n\n## 三欄記號\n\n排程文獻習慣用「機器環境｜限制條件｜目標」三欄來替問題命名 [EJOR2009 §1]。\n\n| 記號 | 讀法 | 出處 |\n|---|---|---|\n| $F2\\mid\\mid C_{\\max}$ | 二機流程工廠、沒有額外限制、最小化 makespan | [EJOR2009 §1] |\n| $F2\\mid f\\mid C_{\\max}$ | 二機流程工廠、某些工作不能排在第一個位置、最小化 makespan | [EJOR2009 §2] |\n| $1\\mid \\sum_{AG_2}U_j=0\\mid \\sum_{AG_1}(\\theta T_j+(1-\\theta)C_j)$ | 單機、第二個代理人的工作不得延遲、最小化第一個代理人的延遲與完工時間加權和 | [TSWJ2014 §2] |\n\n## 相關頁面\n\n- [[concepts/two-machine-flowshop]]、[[concepts/objective-functions]]、[[concepts/two-agent-scheduling]]\n- [[sources/ejor2009]]、[[sources/tswj2014]]\n\n## 更新紀錄\n\n- TSWJ2014：新增交期、延遲時間、SPT、EDD 與雙代理人問題的三欄記號。\n"}, "concepts/two-agent-scheduling": {"meta": {"title": "雙代理人排程（Two-agent scheduling）", "type": "concept", "sources": ["TSWJ2014"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n傳統排程假設所有工作有同一個目標。雙代理人排程則是兩位「客戶」共用同一台機器，各自有自己的一批工作、各自在意不同的事。排程者要在兩邊的要求之間取捨（白話說明）。\n\n## 設定\n\n- 傳統排程中所有工作有共同的目標；多代理人排程中，工作來自不同的客戶，各有各的目標 [TSWJ2014 §1]。\n- 常見的問法是：在第二個代理人的要求被滿足的前提下，讓第一個代理人的目標最好 [TSWJ2014 §1, §2]。\n- TSWJ2014 研究的版本：$AG_1$ 要讓總延遲時間與總完工時間的加權組合 $\\sum(\\theta T_j+(1-\\theta)C_j)$ 最小，$AG_2$ 要求自己的工作都不延遲 [TSWJ2014 §2]。\n\n## 兩邊的要求為什麼會衝突\n\n- 只看 $AG_1$ 的總完工時間，短的工作先做（SPT）最好 [TSWJ2014 §4]。\n- 要檢查 $AG_2$ 的工作會不會延遲，TSWJ2014 用的是交期早的先做（EDD）[TSWJ2014 Property 2]。\n- 兩個規則排出來的順序通常不一樣，所以需要搜尋 [TSWJ2014 §3]；「通常不一樣」是本 Wiki 的補充（推論）。\n\n## 小例子\n\n五個工作，$\\theta=1/2$：$AG_1$ 有 a1 (工時 3, 交期 6)、a2 (2, 9)、a3 (5, 12)；$AG_2$ 有 b1 (4, 6)、b2 (3, 16)（自編例子 E6）。\n\n| 排法 | 順序 | 可行嗎 | $AG_1$ 的目標值 |\n|---|---|---|---|\n| 全部照 SPT（自編例子 E6） | a2→a1→b2→b1→a3 | 不可行，b1 在 12 才完成，超過交期 6 | 14.5（若不管 $AG_2$） |\n| $AG_2$ 先做完再做 $AG_1$（自編例子 E6） | b1→b2→a2→a1→a3 | 可行 | 24.5 |\n| 最佳解（窮舉）（自編例子 E6） | a2→b1→a1→b2→a3 | 可行 | 18 |\n\n120 種順序中只有 22 種可行（自編例子 E6）。最佳解把 a2 插在 b1 前面、把 a1 插在 b2 前面，剛好讓 b1 在交期 6 完成：既不讓 $AG_2$ 延遲，也不讓 $AG_1$ 全部排到最後（自編例子 E6）。\n\n```gantt\n{\"example\": \"E6-opt\", \"rows\": [{\"label\": \"機器\", \"bars\": [{\"job\": \"a2\", \"start\": 0, \"end\": 2, \"group\": 1}, {\"job\": \"b1\", \"start\": 2, \"end\": 6, \"group\": 2}, {\"job\": \"a1\", \"start\": 6, \"end\": 9, \"group\": 1}, {\"job\": \"b2\", \"start\": 9, \"end\": 12, \"group\": 2}, {\"job\": \"a3\", \"start\": 12, \"end\": 17, \"group\": 1}]}], \"caption\": \"最佳順序 a2→b1→a1→b2→a3：目標值 18\"}\n```\n\n## 怎麼解\n\n- 求最佳解：[[algorithms/branch-and-bound]]，在 TSWJ2014 的實驗中可處理到 24 個工作 [TSWJ2014 §5]。\n- 求近似解：[[algorithms/simulated-annealing]]，可處理 100、200 個工作 [TSWJ2014 §5]。\n\n## 與本 Wiki 其他部分的關係\n\n這個分支沒有資源限制，與 [[concepts/relocation-problem]] 沒有直接關係；共通之處只有都是機器排程、都用到完工時間這類目標、都面對 NP-hard 的問題（推論）。\n\n## 相關頁面\n\n- [[sources/tswj2014]]\n- [[concepts/objective-functions]]、[[concepts/scheduling-basics]]、[[concepts/np-hardness]]\n"}, "concepts/two-machine-flowshop": {"meta": {"title": "二機流程工廠與 relocation problem 的等價", "type": "concept", "sources": ["EJOR2009", "DO2006"], "status": "已確認", "updated": "2026-11-16"}, "body": "## 白話說明\n\n想像一條只有兩站的生產線：每件產品都要先過第一站、再過第二站。第一站可以一件接一件不停地做，但第二站有時要「等」第一站把東西送過來，這段等待就是閒置時間（白話說明）。\n\n## 問題\n\n- $F2\\mid\\mid C_{\\max}$：$n$ 個工作依序經過兩台機器，加工時間為 $p_i$、$q_i$，要找 makespan 最小的順序 [EJOR2009 §1]。\n- 這是排程領域最早、最著名的結果之一，Johnson 在 1954 年給出解法 [EJOR2009 §1]。解法見 [[algorithms/johnsons-rule]]。\n\n## 關鍵觀察\n\nmakespan 等於「第二台機器的加工時間總和」加上「第二台機器的閒置時間總和」。前者是固定的，所以要讓 makespan 最小，只要讓第二台機器的閒置時間最少 [EJOR2009 §2]。\n\n## 與 relocation problem 的等價\n\n把 relocation problem 的每個工作對應成流程工廠的一個工作：取用量 $\\alpha_i$ 當作第一台機器的加工時間 $p_i$，歸還量 $\\beta_i$ 當作第二台機器的加工時間 $q_i$。那麼對同一個順序 [EJOR2009 §5]：\n\n$$\\text{第二台機器的閒置時間總和} \\;=\\; \\text{讓這個順序可行所需的初始資源量 } v_0$$\n\n- 這個等價關係由 Kaplan 與 Amir 在 1988 年提出 [EJOR2009 §5]。\n- 因此「找最小的 $v_0$」與「找最小的 makespan」是同一個問題，都可以用 Johnson's rule 在 $O(n\\log n)$ 時間解決 [EJOR2009 §1, §5]。\n- DO2006 也引用同一個結果，用來說明單一工作隊的可行性可以在 $O(n\\log n)$ 時間判定 [DO2006 §1]。\n\n## 小例子\n\n四個工作 A、B、C、D，$(p_i, q_i)$ 分別是 (3, 5)、(6, 2)、(2, 4)、(5, 4)，與 [[concepts/relocation-problem]] 的四棟建物是同一組數字（自編例子 E1）。\n\n| 順序 | makespan | 第二台機器閒置 | 對應的最小 $v_0$ |\n|---|---|---|---|\n| C→A→D→B（Johnson 順序）（自編例子 E1） | 18 | 3 | 3 |\n| A→B→C→D（自編例子 E1） | 20 | 5 | 5 |\n\n第二台機器的加工時間總和是 15，所以 makespan 分別是 15 + 3 = 18 與 15 + 5 = 20，閒置時間正好等於另一邊算出的初始資源量（自編例子 E1）。\n\n```gantt\n{\"example\": \"E1-flowshop\", \"rows\": [{\"label\": \"M1\", \"bars\": [{\"job\": \"C\", \"start\": 0, \"end\": 2}, {\"job\": \"A\", \"start\": 2, \"end\": 5}, {\"job\": \"D\", \"start\": 5, \"end\": 10}, {\"job\": \"B\", \"start\": 10, \"end\": 16}]}, {\"label\": \"M2\", \"bars\": [{\"job\": \"C\", \"start\": 2, \"end\": 6}, {\"job\": \"A\", \"start\": 6, \"end\": 11}, {\"job\": \"D\", \"start\": 11, \"end\": 15}, {\"job\": \"B\", \"start\": 16, \"end\": 18}]}], \"caption\": \"Johnson 順序 C→A→D→B：makespan 18，M2 閒置共 3\"}\n```\n\n```gantt\n{\"example\": \"E1-flowshop-abcd\", \"rows\": [{\"label\": \"M1\", \"bars\": [{\"job\": \"A\", \"start\": 0, \"end\": 3}, {\"job\": \"B\", \"start\": 3, \"end\": 9}, {\"job\": \"C\", \"start\": 9, \"end\": 11}, {\"job\": \"D\", \"start\": 11, \"end\": 16}]}, {\"label\": \"M2\", \"bars\": [{\"job\": \"A\", \"start\": 3, \"end\": 8}, {\"job\": \"B\", \"start\": 9, \"end\": 11}, {\"job\": \"C\", \"start\": 11, \"end\": 15}, {\"job\": \"D\", \"start\": 16, \"end\": 20}]}], \"caption\": \"順序 A→B→C→D：makespan 20，M2 閒置共 5\"}\n```\n\n## 相關頁面\n\n- [[algorithms/johnsons-rule]]、[[concepts/composite-job]]、[[concepts/relocation-problem]]、[[concepts/scheduling-basics]]\n- [[sources/ejor2009]]、[[sources/do2006]]\n"}, "further-reading/do2006": {"meta": {"title": "延伸閱讀｜多個工作隊的 Relocation Problem", "type": "external", "sources": ["DO2006"], "status": "已確認", "updated": "2026-11-16"}, "body": "以下為 Wiki 以外的資料：論文用 Crossref 查證書目存在（2026-11-16），**未讀全文**，推薦理由只依書目、標題，以及五篇來源如何引用它。\n\n## 推薦清單\n\n### Relocation problems are hard\n\n- 作者：Amir, A.; Kaplan, E. H.\n- 年份：1988\n- 出處：International Journal of Computer Mathematics\n- DOI：10.1080/00207168808803664\n- 定位：前一篇的難度結果\n- 對應頁面：[[concepts/np-hardness]]\n- 推薦理由：DO2006 說 Amir 與 Kaplan 用 Partition 證明多個工作隊的問題是 NP-hard，並留下 strongly NP-hard 與否的問題 [DO2006 §1]；這是簡報「主要結果」的前一步（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n### OR Hits the Heights: Relocation Planning at the Orient Heights Housing Project\n\n- 作者：Kaplan, E. H.; Berman, O.\n- 年份：1988\n- 出處：Interfaces\n- DOI：10.1287/inte.18.6.14\n- 定位：應用故事\n- 對應頁面：[[concepts/relocation-problem]]\n- 推薦理由：DO2006 把波士頓住宅重建列為這個問題的來源之一 [DO2006 §1]；想看真實案例可以讀這篇（依標題，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n### Tight complexity analysis of the relocation problem with arbitrary release dates\n\n- 作者：Sevastyanov, S. V.; Lin, B. M. T.; Huang, H.-L.\n- 年份：2011\n- 出處：Theoretical Computer Science\n- DOI：10.1016/j.tcs.2011.04.034\n- 定位：後續研究\n- 對應頁面：[[concepts/parallel-machines]]\n- 推薦理由：JOSH2010 提到 Sevastyanov 等人研究帶釋放時間的 relocation problem 並分析複雜度 [JOSH2010 §1]。想知道多個工作隊的問題還能加上什麼條件，可以讀它（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n## 相關頁面\n\n- [[queries/slides-do2006]]\n- [[sources/do2006]]\n"}, "further-reading/ejor2009": {"meta": {"title": "延伸閱讀｜Relocation Problem 是什麼？從 Johnson's rule 看起", "type": "external", "sources": ["EJOR2009"], "status": "已確認", "updated": "2026-11-16"}, "body": "以下為 Wiki 以外的資料：論文用 Crossref 查證書目存在（2026-11-16），**未讀全文**，推薦理由只依書目、標題，以及五篇來源如何引用它。\n\n## 推薦清單\n\n### Optimal two- and three-stage production schedules with setup times included\n\n- 作者：Johnson, S. M.\n- 年份：1954\n- 出處：Naval Research Logistics Quarterly\n- DOI：10.1002/nav.3800010110\n- 定位：奠基文獻\n- 對應頁面：[[algorithms/johnsons-rule]]\n- 推薦理由：Johnson's rule 的原始論文。EJOR2009 稱它是排程領域最早、最著名的結果之一 [EJOR2009 §1]；看完簡報的「方法」那一張之後，想知道規則最早怎麼提出，可以讀這篇（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n### A fast feasibility test for relocation problems\n\n- 作者：Kaplan, E. H.; Amir, A.\n- 年份：1988\n- 出處：European Journal of Operational Research\n- DOI：10.1016/0377-2217(88)90030-6\n- 定位：等價關係的出處\n- 對應頁面：[[concepts/two-machine-flowshop]]\n- 推薦理由：EJOR2009 與 DO2006 都把「relocation problem 等價於二機流程工廠」的結果歸給這篇 [EJOR2009 §5][DO2006 §1]；想看這個等價關係的原始說明，可以讀它（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n### OR Hits the Heights: Relocation Planning at the Orient Heights Housing Project\n\n- 作者：Kaplan, E. H.; Berman, O.\n- 年份：1988\n- 出處：Interfaces\n- DOI：10.1287/inte.18.6.14\n- 定位：應用故事\n- 對應頁面：[[concepts/relocation-problem]]\n- 推薦理由：EJOR2009 引用它作為波士頓住宅重建的背景 [EJOR2009 §5]。標題顯示它講的是 Orient Heights 住宅計畫的遷置規劃，適合想看真實案例的讀者（依標題，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n## 相關頁面\n\n- [[queries/slides-ejor2009]]\n- [[sources/ejor2009]]\n"}, "further-reading/josh2010": {"meta": {"title": "延伸閱讀｜加上權重與時間：總加權完工時間", "type": "external", "sources": ["JOSH2010"], "status": "已確認", "updated": "2026-11-16"}, "body": "以下為 Wiki 以外的資料：論文用 Crossref 查證書目存在（2026-11-16），**未讀全文**，推薦理由只依書目、標題，以及五篇來源如何引用它。\n\n## 推薦清單\n\n### Tight complexity analysis of the relocation problem with arbitrary release dates\n\n- 作者：Sevastyanov, S. V.; Lin, B. M. T.; Huang, H.-L.\n- 年份：2011\n- 出處：Theoretical Computer Science\n- DOI：10.1016/j.tcs.2011.04.034\n- 定位：相關的後續研究\n- 對應頁面：[[concepts/relocation-problem]]\n- 推薦理由：JOSH2010 引用這篇處理帶釋放時間的 makespan 問題 [JOSH2010 §1]，與簡報的總加權完工時間是不同的目標，可以對照（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n### Maximizing the reward in the relocation problem with generalized due dates\n\n- 作者：Lin, B. M. T.; Liu, Z.\n- 年份：2008\n- 出處：International Journal of Production Economics\n- DOI：10.1016/j.ijpe.2008.04.009\n- 定位：另一種目標\n- 對應頁面：[[concepts/objective-functions]]\n- 推薦理由：標題顯示它在 relocation problem 中考慮廣義交期並最大化報酬，是與完工時間不同的目標，適合想看更多目標函數的讀者。五篇來源都沒有引用它，所以這個推薦只依標題（依標題，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n### A fast feasibility test for relocation problems\n\n- 作者：Kaplan, E. H.; Amir, A.\n- 年份：1988\n- 出處：European Journal of Operational Research\n- DOI：10.1016/0377-2217(88)90030-6\n- 定位：基礎結果\n- 對應頁面：[[concepts/two-machine-flowshop]]\n- 推薦理由：JOSH2010 引用它說明最小初始資源量等價於二機流程工廠的 makespan [JOSH2010 §1]；這是簡報裡「單機版本很容易」那一段的出處（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n## 相關頁面\n\n- [[queries/slides-josh2010]]\n- [[sources/josh2010]]\n"}, "further-reading/josh2016": {"meta": {"title": "延伸閱讀｜加工順序固定的 Relocation 排程", "type": "external", "sources": ["JOSH2016"], "status": "已確認", "updated": "2026-11-16"}, "body": "以下為 Wiki 以外的資料：論文用 Crossref 查證書目存在（2026-11-16），**未讀全文**，推薦理由只依書目、標題，以及五篇來源如何引用它。\n\n## 推薦清單\n\n### Complexity of single machine scheduling subject to nonnegative inventory constraints\n\n- 作者：Briskorn, D.; Choi, B.-C.; Lee, K.; Leung, J.; Pinedo, M.\n- 年份：2010\n- 出處：European Journal of Operational Research\n- DOI：10.1016/j.ejor.2010.05.036\n- 定位：相關領域\n- 對應頁面：[[concepts/resource-constrained-scheduling]]\n- 推薦理由：JOSH2016 在結論把庫存限制排程列為與 relocation problem 相關的領域，並引用這篇 [JOSH2016 §6]；想知道庫存限制的單機問題複雜度，可以讀它（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n### Maximizing the reward in the relocation problem with generalized due dates\n\n- 作者：Lin, B. M. T.; Liu, Z.\n- 年份：2008\n- 出處：International Journal of Production Economics\n- DOI：10.1016/j.ijpe.2008.04.009\n- 定位：同一個問題的另一種目標\n- 對應頁面：[[concepts/objective-functions]]\n- 推薦理由：標題顯示它在 relocation problem 中考慮廣義交期，與簡報裡的 $L_{\\max}$、延遲類目標相近。五篇來源都沒有引用它，所以這個推薦只依標題（依標題，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n### Relocation problems are hard\n\n- 作者：Amir, A.; Kaplan, E. H.\n- 年份：1988\n- 出處：International Journal of Computer Mathematics\n- DOI：10.1080/00207168808803664\n- 定位：入門的難度結果\n- 對應頁面：[[concepts/np-hardness]]\n- 推薦理由：JOSH2016 引用它說明兩個工作隊的問題為何難 [JOSH2016 §1]；想先理解為什麼一般版本難、才看固定順序的簡化，可以先讀它（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n## 相關頁面\n\n- [[queries/slides-josh2016]]\n- [[sources/josh2016]]\n"}, "further-reading/tswj2014": {"meta": {"title": "延伸閱讀｜雙代理人單機排程", "type": "external", "sources": ["TSWJ2014"], "status": "已確認", "updated": "2026-11-16"}, "body": "以下為 Wiki 以外的資料：論文用 Crossref 查證書目存在（2026-11-16），**未讀全文**，推薦理由只依書目、標題，以及五篇來源如何引用它。\n\n## 推薦清單\n\n### Scheduling Problems with Two Competing Agents\n\n- 作者：Agnetis, A.; Mirchandani, P. B.; Pacciarelli, D.; Pacifici, A.\n- 年份：2004\n- 出處：Operations Research\n- DOI：10.1287/opre.1030.0092\n- 定位：奠基文獻\n- 對應頁面：[[concepts/two-agent-scheduling]]\n- 推薦理由：TSWJ2014 稱 Agnetis 等人與 Baker 與 Smith 是把多代理人問題引入排程領域的先驅 [TSWJ2014 §1]；想從頭看雙代理人模型，先讀這篇（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n### A Multiple-Criterion Model for Machine Scheduling\n\n- 作者：Baker, K. R.; Smith, J. C.\n- 年份：2003\n- 出處：Journal of Scheduling\n- DOI：10.1023/a:1022231419049\n- 定位：奠基文獻\n- 對應頁面：[[concepts/two-agent-scheduling]]\n- 推薦理由：同上，與上一篇一起讀可以看到兩個團隊各自怎麼定義問題；原文說它證明了混合式目標是 NP-hard [TSWJ2014 §1]（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n### Competitive Two-Agent Scheduling and Its Applications\n\n- 作者：Leung, J. Y.-T.; Pinedo, M.; Wan, G.\n- 年份：2010\n- 出處：Operations Research\n- DOI：10.1287/opre.1090.0744\n- 定位：後續推廣\n- 對應頁面：[[algorithms/branch-and-bound]]\n- 推薦理由：TSWJ2014 說這篇把 Agnetis 等人的單機問題推廣到多台相同機器 [TSWJ2014 §1]；想知道問題放大之後怎麼處理，可以接著讀（依書目，未讀全文）。\n- 查證：Crossref 2026-11-16\n\n## 相關頁面\n\n- [[queries/slides-tswj2014]]\n- [[sources/tswj2014]]\n"}, "index": {"meta": {"title": "index（內容目錄）", "type": "導覽"}, "body": "# 內容目錄\n\n每次 ingest 後更新。查詢時先讀這一頁找相關頁面。\n\n## 總覽\n\n- [[overview]]：Wiki 的範圍、主線與閱讀入口\n- [[open-questions]]：待確認與原文不一致之處的總表\n- [[log]]：操作與檢查紀錄\n\n## 來源（論文）\n\n- [[sources/do2006]]：Kononov & Lin (2006)，多個工作隊的 relocation problem；兩台機器即 strongly NP-hard，近似比 2 與 3−2/m\n- [[sources/ejor2009]]：Cheng & Lin (2009)，Johnson's rule、composite job，以及 relocation problem 與二機流程工廠的等價\n- [[sources/josh2010]]：Kononov & Lin (2010)，單機 relocation problem 的總加權完工時間；四個特例 strongly NP-hard，Algorithm W 近似比 2\n- [[sources/tswj2014]]：Lee 等 (2014)，雙代理人單機排程；branch-and-bound 與兩種模擬退火（獨立分支）\n- [[sources/josh2016]]：Lin, Hwang & Kononov (2016)，兩台專用機、順序固定的 relocation 排程；六種目標的複雜度分界與動態規劃\n\n## 概念\n\n- [[concepts/relocation-problem]]：問題的故事、模型與小例子\n- [[concepts/resource-constrained-scheduling]]：資源限制排程，以及 relocation problem 特別在哪裡\n- [[concepts/parallel-machines]]：相同機與專用機；為什麼多了機器反而變難\n- [[concepts/fixed-sequence]]：順序已定、只決定開始時間的問題，以及它為什麼不簡單\n- [[concepts/scheduling-basics]]：工作、機器、流程工廠與三欄記號\n- [[concepts/two-machine-flowshop]]：二機流程工廠，以及它為什麼等於單一工作隊的 relocation problem\n- [[concepts/composite-job]]：把一串工作濃縮成一個等效工作\n- [[concepts/two-agent-scheduling]]：兩位客戶共用一台機器時的取捨，含五個工作的小例子\n- [[concepts/objective-functions]]：排程要最佳化什麼\n- [[concepts/np-hardness]]：NP-hard 與 strongly NP-hard 的白話解釋與證明方式\n- [[concepts/approximation-algorithm]]：近似比的定義、正面與負面結果\n\n## 演算法\n\n- [[algorithms/johnsons-rule]]：二機流程工廠的最佳排法、兩種寫法與投資觀點的解釋\n- [[algorithms/algorithm-w]]：輪流依權重與淨貢獻挑工作的 2 倍近似演算法，含原文例子的逐步執行\n- [[algorithms/backward-dp]]：用排程區塊做動態規劃的三種演算法（BDP-1、BDP-2、FDP）\n- [[algorithms/branch-and-bound]]：用支配性質、可行性與下界剪枝來求最佳解\n- [[algorithms/simulated-annealing]]：隨機對調加上逐漸降低的接受機率，兩個版本的差別\n- [[algorithms/rounding-and-splitting]]：放寬、補整、拆開三步驟的近似演算法與小例子\n\n## 跨論文比較\n\n- [[comparisons/complexity-table]]：各問題版本的複雜度與近似結果\n- [[comparisons/papers-at-a-glance]]：每篇論文的機器環境、目標、方法與主要結果\n\n## 簡報稿與延伸閱讀\n\n- [[queries/slides-ejor2009]]：Relocation Problem 是什麼？從 Johnson's rule 看起；延伸閱讀見 [[further-reading/ejor2009]]\n- [[queries/slides-do2006]]：多個工作隊：人手變多，問題反而變難；延伸閱讀見 [[further-reading/do2006]]\n- [[queries/slides-josh2010]]：重要的工作先做？資源說了算；延伸閱讀見 [[further-reading/josh2010]]\n- [[queries/slides-josh2016]]：順序都定好了，還有什麼好決定？；延伸閱讀見 [[further-reading/josh2016]]\n- [[queries/slides-tswj2014]]：兩位客戶共用一台機器；延伸閱讀見 [[further-reading/tswj2014]]\n"}, "log": {"meta": {"title": "log（操作紀錄）", "type": "導覽"}, "body": "# 操作紀錄\n\n只能往後加。每筆標題格式：`## [日期] 操作 | 標題`。檢查的原始輸出在 `runs/`。\n\n## [2026-11-16] discuss | 主題、來源與做法\n\n- 使用者決定：延續排程論文主題，但不參考作業九，獨立製作；參考 Karpathy 的 LLM Wiki。\n- 來源由使用者提供，五篇 PDF 已放在 `raw/`。\n- 流程實作採「Claude Code 流程＋檢查腳本」；只做本機檔案。\n\n## [2026-11-16] discuss | 讀完五篇後的重點與疑點\n\n- AI 讀完五篇（含直接看 PDF 頁面確認被文字擷取弄丟的符號），回報每篇一句話摘要與五個疑點（見 `CLAUDE.md` 第 12 節）。\n- 使用者決定：`TSWJ2014` 作為獨立分支，只連共通概念；Wiki 重點放在「複雜度結果總表」與「演算法步驟與小例子」；形式為 Markdown ＋自動產生的瀏覽頁。\n- 使用者要求：正式執行前先檢查 `CLAUDE.md`。\n\n## [2026-11-16] schema | CLAUDE.md 初稿與兩輪修改\n\n- 初稿：三層架構、來源標註規則、Ingest／Query／Lint、三個檢查點的流程圖。\n- 第一輪修改（使用者要求）：數學式改用 LaTeX；新增「延伸閱讀」操作，允許上網搜尋，並加上書目查證檢查點 C3。\n- 第二輪修改（使用者更正 AI 的理解）：不是只做一份簡報，而是**每篇論文各一份**，共五份；流程圖改成兩個外圈（ingest 圈、簡報圈）。\n- AI 的設計調整：簡報稿改由腳本轉成 HTML，數字核對從最後的簡報檢查提前到簡報稿檢查（C2）。\n\n## [2026-11-16] build | 檢查與建置腳本\n\n- 新增 `scripts/`：`common.py`、`examples.py`、`lint_wiki.py`（C1）、`check_outline.py`（C2）、`check_further_reading.py`（C3）、`build_slides.py`（N6）、`check_slides.py`（C4）、`build_viewer.py`。\n- `examples.py` 第一次執行後調整了兩個自編例子的參數：E5 的初始資源由 3 改為 4（原本幾乎完全無法平行，看不出重疊）；E6 改成純 SPT 會讓 AG2 延遲的數字（原本純 SPT 剛好可行，顯示不出兩個代理人的衝突）。\n- `CLAUDE.md` 第 4 節補上 `（白話說明）` 標記。\n\n## [2026-11-16] ingest | DO2006\n\n- 新增 `sources/do2006`；新增概念頁 `relocation-problem`、`resource-constrained-scheduling`、`parallel-machines`、`objective-functions`、`np-hardness`、`approximation-algorithm`；新增 `algorithms/rounding-and-splitting`、`comparisons/complexity-table`、`comparisons/papers-at-a-glance`、`overview`、`open-questions`、`index`。共 14 頁。\n- 自編例子 E1（四棟建物的最小初始資源）、E4（六個工作、多個工作隊）由 `scripts/examples.py` 計算。\n- 寫入 3 項待確認（Q1–Q3）。其中 Q3（Rounding 新時段的插入位置）是實作 E4 時才發現的，不在最初的清單裡。\n\n## [2026-11-16] check | C1 第 1 輪（DO2006）：不通過，5 項錯誤\n\n- 紀錄：`runs/20261116-013309-C1-ingest1-do2006.txt`\n- 頁面格式問題 1 項：`rounding-and-splitting` 用粗體當小標題，被當成沒有來源的段落。\n- 檢查工具認不得的寫法 4 項：表格裡的 `[[頁面\\|別名]]` 被當成斷鏈；獨立一行的數學式、純導覽句（「完整列表見…」）、閱讀說明被當成沒有來源的事實。\n\n## [2026-11
